AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TEMPORARY mostly compliant EKS cluster for the aws-eks-compliance-checker skill evals
  (false-FAIL check). Delete after the run. The public endpoint stays open because
  DevOps Agent reaches the cluster API over the public endpoint in this test.

Parameters:
  ClusterName:
    Type: String
    Default: cis-skill-compliant
  KubernetesVersion:
    Type: String
    Default: "1.37"

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.43.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${ClusterName}-vpc" }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.0.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PublicAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet, RouteTableId: !Ref PublicRt }
  NatEip:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  Nat:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt NatEip.AllocationId, SubnetId: !Ref PublicSubnet }

  # Nodes run in private subnets without public IPs (CIS 5.4.3).
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.16.0/20
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
      Tags: [{ Key: kubernetes.io/role/internal-elb, Value: "1" }]
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.32.0/20
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: false
      Tags: [{ Key: kubernetes.io/role/internal-elb, Value: "1" }]
  PrivateRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateDefault:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRt, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat }
  PrivateAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateA, RouteTableId: !Ref PrivateRt }
  PrivateBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateB, RouteTableId: !Ref PrivateRt }

  # Secrets encryption with a customer managed KMS key (CIS 5.3.1).
  SecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${ClusterName} secrets encryption (temporary)"
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  # Audit log retention set (CIS 2.1.2). EKS writes to this existing group.
  ClusterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/eks/${ClusterName}/cluster"
      RetentionInDays: 30

  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: eks.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonEKSClusterPolicy]
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly

  Cluster:
    Type: AWS::EKS::Cluster
    DependsOn: ClusterLogGroup
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: true
      EncryptionConfig:
        - Resources: [secrets]
          Provider: { KeyArn: !GetAtt SecretsKey.Arn }
      Logging:
        ClusterLogging:
          EnabledTypes:
            - { Type: api }
            - { Type: audit }
            - { Type: authenticator }
            - { Type: controllerManager }
            - { Type: scheduler }
      ResourcesVpcConfig:
        SubnetIds: [!Ref PrivateA, !Ref PrivateB]
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs: [0.0.0.0/0]

  # VPC CNI with network policy enforcement on (CIS 4.3.1).
  VpcCni:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
      ConfigurationValues: '{"enableNetworkPolicy":"true"}'

  # Encrypted node volumes (AWS-7) and IMDSv2 required (AWS-8).
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }

  Nodegroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: VpcCni
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: AL2023_x86_64_STANDARD
      InstanceTypes: [t3.medium]
      Subnets: [!Ref PrivateA, !Ref PrivateB]
      LaunchTemplate: { Id: !Ref NodeLaunchTemplate, Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber }
      ScalingConfig: { MinSize: 2, DesiredSize: 2, MaxSize: 2 }

Outputs:
  ClusterName:
    Value: !Ref Cluster
