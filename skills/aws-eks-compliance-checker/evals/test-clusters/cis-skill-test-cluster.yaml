AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TEMPORARY, deliberately misconfigured EKS cluster for the aws-eks-compliance-checker
  skill evals (see skills/aws-eks-compliance-checker/evals/TESTING.md). Delete after the run.

Parameters:
  ClusterName:
    Type: String
    Default: cis-skill-test
  KubernetesVersion:
    Type: String
    Default: "1.37"

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${ClusterName}-vpc" }]

  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }

  # Deliberate finding (CIS 5.4.3): nodes in public subnets that map public IPs.
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags: [{ Key: kubernetes.io/role/elb, Value: "1" }]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags: [{ Key: kubernetes.io/role/elb, Value: "1" }]
  # Egress goes through a NAT gateway so the nodes can join when the account has
  # VPC Block Public Access in block-ingress mode. The node subnets still map
  # public IPs on launch, so CIS 5.4.3 still fails.
  NatSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.32.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
  NatSubnetRt:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref NatSubnet, RouteTableId: !Ref PublicRt }
  NatEip:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  Nat:
    Type: AWS::EC2::NatGateway
    DependsOn: IgwAttach
    Properties: { AllocationId: !GetAtt NatEip.AllocationId, SubnetId: !Ref NatSubnet }
  NodeRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  NodeDefault:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref NodeRt, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat }
  SubnetARt:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref NodeRt }
  SubnetBRt:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref NodeRt }

  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: eks.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonEKSClusterPolicy]

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  # Deliberate findings: public endpoint open to 0.0.0.0/0 (CIS 5.4.1/5.4.2),
  # only the api log type (CIS 2.1.1), no secrets encryptionConfig (CIS 5.3.1),
  # API_AND_CONFIG_MAP auth mode.
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      Logging:
        ClusterLogging:
          EnabledTypes: [{ Type: api }]
      ResourcesVpcConfig:
        SubnetIds: [!Ref SubnetA, !Ref SubnetB]
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs: [0.0.0.0/0]

  # Deliberate finding: unencrypted node volumes (account EBS default encryption is off).
  # After CREATE_COMPLETE, tag the node group's Auto Scaling group with auto-stop=no
  # (aws autoscaling create-or-update-tags) if account automation scales node groups to 0 out of hours, which removes
  # the bare test pods (priv-pod, hostnet-pod, hardened-pod).
  Nodegroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: NodeDefault
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: AL2023_x86_64_STANDARD
      InstanceTypes: [t3.medium]
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      ScalingConfig: { MinSize: 2, DesiredSize: 2, MaxSize: 2 }

Outputs:
  ClusterName:
    Value: !Ref Cluster
