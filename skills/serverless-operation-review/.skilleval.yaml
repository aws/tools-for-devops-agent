# Skill evaluation config
# See: https://github.com/aws-samples/sample-agent-skill-eval
audit:
  ignore:
    - eval_results.json
  # This skill cites AWS documentation for every threshold it applies, so the
  # citations are the point rather than an unexplained external call.
  safe_domains:
    - docs.aws.amazon.com
    - aws.amazon.com
    - repost.aws
    - github.com
