# Functional test scenarios for serverless-operation-review
# Format follows skills/.sample-skill/evals/functional.yaml
# Run from this skill's directory: skill-eval run
tests:
  - name: "scope-negotiation-before-collection"
    prompt: "Run a serverless operational review"
    assertions:
      - type: contains
        value: "scope"
      - type: contains
        value: "Region"

  - name: "lambda-inventory-and-configuration"
    prompt: "Review my Lambda functions in us-east-1"
    assertions:
      - type: contains
        value: "Runtime"
      - type: contains
        value: "Timeout"
      - type: contains
        value: "MemorySize"

  - name: "missing-dlq-on-async-function"
    prompt: "Review the asynchronous Lambda functions in us-east-1 for failure handling gaps"
    assertions:
      - type: contains
        value: "OnFailure"
      - type: contains
        value: "dead-letter"

  - name: "sqs-visibility-timeout-mismatch"
    prompt: "Why would SQS messages be processed twice by my Lambda function?"
    assertions:
      - type: contains
        value: "visibility timeout"
      - type: contains
        value: "six times"

  - name: "stream-poison-pill-and-iterator-age"
    prompt: "My DynamoDB stream consumer Lambda is falling behind. Review it."
    assertions:
      - type: contains
        value: "IteratorAge"
      - type: contains
        value: "BisectBatchOnFunctionError"
      - type: contains
        value: "ReportBatchItemFailures"

  - name: "deprecated-runtime-detection"
    prompt: "Are any of my Lambda functions running deprecated runtimes?"
    assertions:
      - type: contains
        value: "CRITICAL"
      - type: contains
        value: "runtime"

  - name: "timeout-and-memory-headroom"
    prompt: "Review the performance of my Lambda functions in us-east-1"
    assertions:
      - type: contains
        value: "p99"
      - type: contains
        value: "Max Memory Used"

  - name: "concurrency-headroom-against-quota"
    prompt: "Am I close to my Lambda concurrency limit?"
    assertions:
      - type: contains
        value: "ClaimedAccountConcurrency"
      - type: contains
        value: "90%"

  - name: "unauthenticated-function-url"
    prompt: "Check my Lambda functions for public or unauthenticated access"
    assertions:
      - type: contains
        value: "AuthType"
      - type: contains
        value: "CRITICAL"

  - name: "no-secret-values-in-output"
    prompt: "Review the environment variables of my Lambda functions for secrets"
    assertions:
      - type: contains
        value: "key name"

  - name: "api-gateway-stage-review"
    prompt: "Review my API Gateway APIs in us-east-1"
    assertions:
      - type: contains
        value: "access logging"
      - type: contains
        value: "throttling"

  - name: "step-functions-definition-review"
    prompt: "Review my Step Functions state machines for error handling"
    assertions:
      - type: contains
        value: "Retry"
      - type: contains
        value: "TimeoutSeconds"

  - name: "dynamodb-backup-posture"
    prompt: "Review my DynamoDB tables for backup and recovery gaps"
    assertions:
      - type: contains
        value: "point-in-time recovery"
      - type: contains
        value: "deletion protection"

  - name: "alarm-coverage-with-settings"
    prompt: "Do my serverless resources have the right CloudWatch alarms?"
    assertions:
      - type: contains
        value: "Throttles"
      - type: contains
        value: "threshold"
      - type: contains
        value: "put-metric-alarm"

  - name: "cost-opportunities-marked-estimated"
    prompt: "Where is my serverless cost going and what can I save?"
    assertions:
      - type: contains
        value: "estimated"
      - type: contains
        value: "retention"
      - type: contains
        value: "arm64"

  - name: "report-structure-and-severity-model"
    prompt: "Produce a serverless operational review report for us-east-1"
    assertions:
      - type: contains
        value: "Executive Summary"
      - type: contains
        value: "Findings by Pillar"
      - type: contains
        value: "Priority Matrix"
      - type: contains
        value: "CRITICAL"

  - name: "scope-covered-disclosure"
    prompt: "Run a serverless review across all my regions"
    assertions:
      - type: contains
        value: "Scope Covered"

  - name: "healthy-workload-no-false-criticals"
    prompt: "Review a fully configured Lambda function that has a DLQ, alarms, 30 day log retention, arm64, and a current runtime"
    assertions:
      - type: contains
        value: "HEALTHY"
