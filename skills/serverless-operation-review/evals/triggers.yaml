# Trigger tests — verify the agent activates (or does not activate) this skill
# Format follows skills/.sample-skill/evals/triggers.yaml
tests:
  # --- should activate ---
  - name: "trigger-serverless-review"
    prompt: "Run a serverless operational review for my account"
    expect_skill: true

  - name: "trigger-lambda-review"
    prompt: "Review my Lambda functions against best practices"
    expect_skill: true

  - name: "trigger-health-question"
    prompt: "How healthy is my serverless workload?"
    expect_skill: true

  - name: "trigger-duplicate-sqs-processing"
    prompt: "Why are my SQS messages being processed twice by Lambda?"
    expect_skill: true

  - name: "trigger-missing-async-events"
    prompt: "My asynchronous Lambda invocations seem to be disappearing"
    expect_skill: true

  - name: "trigger-lambda-throttling"
    prompt: "My Lambda functions are getting throttled, what should I check?"
    expect_skill: true

  - name: "trigger-deprecated-runtime"
    prompt: "Do I have any Lambda functions on deprecated runtimes?"
    expect_skill: true

  - name: "trigger-stream-lag"
    prompt: "My Kinesis stream consumer Lambda IteratorAge keeps growing"
    expect_skill: true

  - name: "trigger-apigateway-review"
    prompt: "Review my API Gateway stages for logging and throttling gaps"
    expect_skill: true

  - name: "trigger-stepfunctions-review"
    prompt: "Audit my Step Functions state machines for retry and timeout coverage"
    expect_skill: true

  - name: "trigger-serverless-cost"
    prompt: "Where is my Lambda and CloudWatch Logs cost going?"
    expect_skill: true

  - name: "trigger-serverless-orr"
    prompt: "Perform a serverless operational readiness review before our launch"
    expect_skill: true

  # --- should NOT activate: other services own these ---
  - name: "no-trigger-rds-review"
    prompt: "Review my RDS instances and Aurora clusters for best practices"
    expect_skill: false

  - name: "no-trigger-eks-review"
    prompt: "Run an EKS cluster operational review and check my node groups"
    expect_skill: false

  - name: "no-trigger-redshift-review"
    prompt: "Review my Redshift cluster performance and WLM configuration"
    expect_skill: false

  - name: "no-trigger-ecs-review"
    prompt: "Review my ECS services and task definitions on EC2 capacity providers"
    expect_skill: false

  - name: "no-trigger-msk-review"
    prompt: "Troubleshoot my MSK provisioned cluster broker storage"
    expect_skill: false

  - name: "no-trigger-ec2-troubleshooting"
    prompt: "My EC2 instance failed its status checks, help me troubleshoot"
    expect_skill: false

  - name: "no-trigger-vpc-dns"
    prompt: "DNS resolution is failing inside my VPC, investigate the resolver"
    expect_skill: false

  - name: "no-trigger-s3-resiliency"
    prompt: "Review my S3 bucket replication and versioning posture"
    expect_skill: false

  - name: "no-trigger-support-cases"
    prompt: "Generate a support cases report for the last quarter by service and severity"
    expect_skill: false

  - name: "no-trigger-health-events"
    prompt: "Show me open AWS Health events affecting my account"
    expect_skill: false

  - name: "no-trigger-generic-billing"
    prompt: "Explain how AWS Savings Plans differ from Reserved Instances"
    expect_skill: false

  - name: "no-trigger-unrelated-coding"
    prompt: "Write me a Python script that reverses a linked list"
    expect_skill: false
