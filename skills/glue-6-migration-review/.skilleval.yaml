# Agent Skill Eval configuration for glue-6-migration-review
# Reference: https://github.com/aws-samples/sample-agent-skill-eval

audit:
  # README.md is documentation for repo readers, not part of the skill payload
  # the agent loads; exclude it from audit structure/content checks.
  ignore:
    - README.md
    - CHANGELOG.md
    - .skilleval.yaml
