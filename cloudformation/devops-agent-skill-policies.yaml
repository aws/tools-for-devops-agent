AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Adds skill-specific IAM inline policies to a DevOps Agent role.
  Provide ExistingRoleName to attach policies to an existing role, or leave
  empty to create a new role with AIDevOpsAgentAccessPolicy attached.
  Does NOT create an Agent Space — deploy the space separately and associate
  the role ARN from this stack's output.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Role Configuration
        Parameters:
          - ExistingRoleName
      - Label:
          default: Skill Activation
        Parameters:
          - EnableAwsHealthEvents
          - EnableSupportCases
          - EnableRdsOperationReview
          - EnableEksOperationReview
          - EnableEcsOperationReview
          - EnableInvestigationCostGuardrail
          - EnableEnrichWithSecurityAgent
          - EnableCrmInvestigationGuidelines
          - EnableSkipScheduledMaintenance
          - EnableMskOperations
          - EnableServiceQuotaCheck
          - EnableDmsOperationReview
          - EnableAwsBackupCoverageReview
          - EnableAgentCoreObservabilitySetup
          - EnableAgentCoreOpsReview
          - EnableSageMakerAIOpsReview
          - EnableAwsFsxnOperationsReview
      - Label:
          default: Optional Resource Scoping
        Parameters:
          - AllowedRegions
      - Label:
          default: Optional Add-On Permissions
        Parameters:
          - EnableConfigAthenaCiAnalysis

Parameters:
  ExistingRoleName:
    Type: String
    Description: >
      Name of an existing DevOps Agent role. Leave empty to create a new one.
    Default: ''

  AllowedRegions:
    Type: CommaDelimitedList
    Description: >
      (Optional) Restrict agent to these regions. Leave empty for all regions.
    Default: ''

  EnableAwsHealthEvents:
    Type: String
    Description: AWS Health Events skill (requires Business/Enterprise Support).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableSupportCases:
    Type: String
    Description: Support Cases skill (requires Business/Enterprise Support).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableRdsOperationReview:
    Type: String
    Description: RDS Operation Review skill.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableEksOperationReview:
    Type: String
    Description: EKS Operation Review skill (covered by managed policy).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableEcsOperationReview:
    Type: String
    Description: ECS Operation Review skill (adds compute-optimizer:GetECSServiceRecommendations for the PERF8 rightsizing check).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableInvestigationCostGuardrail:
    Type: String
    Description: Investigation Cost Guardrail skill.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableEnrichWithSecurityAgent:
    Type: String
    Description: Enrich with AWS Security Agent skill (covered by managed policy).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableCrmInvestigationGuidelines:
    Type: String
    Description: CRM Production Investigation Guidelines skill (covered by managed policy).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableSkipScheduledMaintenance:
    Type: String
    Description: Skip Scheduled Maintenance skill (no IAM needed).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableMskOperations:
    Type: String
    Description: MSK Operations skill (adds kafka:GetBootstrapBrokers).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableServiceQuotaCheck:
    Type: String
    Description: Service Quota Check skill (Service Quotas + CloudWatch).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableDmsOperationReview:
    Type: String
    Description: DMS Operational Review skill (adds dms:TestConnection).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableAwsBackupCoverageReview:
    Type: String
    Description: >
      AWS Backup Coverage Review skill (adds backup:GetSupportedResourceTypes,
      config:SelectResourceConfig, dsql:ListClusters, storagegateway:List*).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableAgentCoreObservabilitySetup:
    Type: String
    Description: AgentCore Observability Setup skill (adds read-only bedrock-agentcore, X-Ray, log-delivery, and Lambda/ECS/EKS host-config permissions).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableAgentCoreOpsReview:
    Type: String
    Description: AgentCore Operational Review skill (adds read-only bedrock-agentcore control-plane List/Get and ec2:DescribeSubnets for the multi-AZ check; observability-only mode needs none of these).
    AllowedValues: ['true', 'false']
    Default: 'true'
  EnableSageMakerAIOpsReview:
    Type: String
    Description: SageMaker AI Operational Review skill (adds savingsplans:DescribeSavingsPlans for the Savings Plan check).
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableAwsFsxnOperationsReview:
    Type: String
    Description: >
      Amazon FSx for NetApp ONTAP Operational Review skill (read-only: adds
      fsx:Describe*/ListTagsForResource, cloudwatch metric/alarm reads,
      backup:ListProtectedResources/ListRecoveryPointsByResource, and
      ec2:DescribeSecurityGroups/Subnets/RouteTables).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableConfigAthenaCiAnalysis:
    Type: String
    Description: >
      Optional add-on for the config-cost-optimization skill: grants the extra permissions
      the Athena CI-driver attribution path needs (athena query execution + results, Glue
      Data Catalog reads, and s3:GetObject on the Config delivery data). OFF by default and
      least-privilege. Also requires an Athena
      workgroup configured with Athena-managed query results, because the DevOps Agent role
      has no s3:PutObject to write results to a customer bucket. Without this add-on the
      skill falls back to GetDiscoveredResourceCounts (labeled approximate) and the Athena
      path returns AccessDenied. Set ConfigDataBucketArn to scope the s3:GetObject grant to
      the Config delivery bucket; leave it at '*' only for testing.
    AllowedValues: ['true', 'false']
    Default: 'false'

  ConfigDataBucketArn:
    Type: String
    Description: >
      Bucket ARN holding the AWS Config delivery data that Athena queries (e.g.
      arn:aws:s3:::my-config-bucket). Used only when EnableConfigAthenaCiAnalysis=true to
      scope s3:GetObject to that bucket. Leave empty to grant s3:GetObject on all buckets
      (testing only — not recommended).
    Default: ''

Conditions:
  CreateNewRole: !Equals [!Ref ExistingRoleName, '']
  SkillAwsHealthEvents: !Equals [!Ref EnableAwsHealthEvents, 'true']
  SkillSupportCases: !Equals [!Ref EnableSupportCases, 'true']
  SkillRdsOperationReview: !Equals [!Ref EnableRdsOperationReview, 'true']
  SkillEcsOperationReview: !Equals [!Ref EnableEcsOperationReview, 'true']
  SkillInvestigationCostGuardrail: !Equals [!Ref EnableInvestigationCostGuardrail, 'true']
  SkillMskOperations: !Equals [!Ref EnableMskOperations, 'true']
  SkillServiceQuotaCheck: !Equals [!Ref EnableServiceQuotaCheck, 'true']
  SkillDmsOperationReview: !Equals [!Ref EnableDmsOperationReview, 'true']
  SkillAwsBackupCoverageReview: !Equals [!Ref EnableAwsBackupCoverageReview, 'true']
  SkillAgentCoreObservabilitySetup: !Equals [!Ref EnableAgentCoreObservabilitySetup, 'true']
  SkillAgentCoreOpsReview: !Equals [!Ref EnableAgentCoreOpsReview, 'true']
  SkillSageMakerAIOpsReview: !Equals [!Ref EnableSageMakerAIOpsReview, 'true']
  SkillAwsFsxnOperationsReview: !Equals [!Ref EnableAwsFsxnOperationsReview, 'true']
  ConfigAthenaCiAnalysis: !Equals [!Ref EnableConfigAthenaCiAnalysis, 'true']
  HasConfigDataBucketArn: !Not [!Equals [!Ref ConfigDataBucketArn, '']]
  HasRegionRestriction: !Not [!Equals [!Join ['', !Ref AllowedRegions], '']]

Resources:
  # New role — only created when ExistingRoleName is empty
  DevOpsAgentRole:
    Type: AWS::IAM::Role
    Condition: CreateNewRole
    Properties:
      RoleName: DevOpsAgentRole-AgentSpace
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: aidevops.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:aidevops:*:${AWS::AccountId}:agentspace/*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AIDevOpsAgentAccessPolicy
      Tags:
        - Key: ManagedBy
          Value: CloudFormation

  # Required for topology discovery
  PolicyResourceExplorerSLR:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AllowCreateResourceExplorerSLR
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCreateServiceLinkedRoles
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/resource-explorer-2.amazonaws.com/AWSServiceRoleForResourceExplorer'

  # aws-health-events: adds health:DescribeEventTypes
  PolicyAwsHealthEvents:
    Type: AWS::IAM::Policy
    Condition: SkillAwsHealthEvents
    Properties:
      PolicyName: DevOpsAgentSkill-AwsHealthEvents
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: HealthEventTypes
            Effect: Allow
            Action:
              - health:DescribeEventTypes
            Resource: '*'

  # support-cases: adds support:DescribeCommunications
  PolicySupportCases:
    Type: AWS::IAM::Policy
    Condition: SkillSupportCases
    Properties:
      PolicyName: DevOpsAgentSkill-SupportCases
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SupportCommunications
            Effect: Allow
            Action:
              - support:DescribeCommunications
            Resource: '*'

  # rds-operation-review: adds rds:DownloadDBLogFilePortion, logs:GetLogEvents
  PolicyRdsOperationReview:
    Type: AWS::IAM::Policy
    Condition: SkillRdsOperationReview
    Properties:
      PolicyName: DevOpsAgentSkill-RdsOperationReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RdsLogDownload
            Effect: Allow
            Action:
              - rds:DownloadDBLogFilePortion
            Resource: '*'
          - Sid: CloudWatchLogsGetEvents
            Effect: Allow
            Action:
              - logs:GetLogEvents
            Resource: '*'

  # ecs-operation-review: adds compute-optimizer:GetECSServiceRecommendations (PERF8 rightsizing);
  # every other API the skill uses is covered by AIDevOpsAgentAccessPolicy
  PolicyEcsOperationReview:
    Type: AWS::IAM::Policy
    Condition: SkillEcsOperationReview
    Properties:
      PolicyName: DevOpsAgentSkill-EcsOperationReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ComputeOptimizerEcsRecommendations
            Effect: Allow
            Action:
              - compute-optimizer:GetECSServiceRecommendations
            Resource: '*'

  # investigation-cost-guardrail: adds pricing:GetProducts
  PolicyInvestigationCostGuardrail:
    Type: AWS::IAM::Policy
    Condition: SkillInvestigationCostGuardrail
    Properties:
      PolicyName: DevOpsAgentSkill-InvestigationCostGuardrail
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PricingAccess
            Effect: Allow
            Action:
              - pricing:GetProducts
            Resource: '*'

  # msk-operations: adds kafka:GetBootstrapBrokers
  PolicyMskOperations:
    Type: AWS::IAM::Policy
    Condition: SkillMskOperations
    Properties:
      PolicyName: DevOpsAgentSkill-MskOperations
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: MskBootstrapBrokers
            Effect: Allow
            Action:
              - kafka:GetBootstrapBrokers
            Resource: '*'

  # service-quota-check: adds servicequotas:* and cloudwatch:GetMetricData/GetMetricStatistics
  PolicyServiceQuotaCheck:
    Type: AWS::IAM::Policy
    Condition: SkillServiceQuotaCheck
    Properties:
      PolicyName: DevOpsAgentSkill-ServiceQuotaCheck
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ServiceQuotasReadAndRequest
            Effect: Allow
            Action:
              - servicequotas:ListServices
              - servicequotas:ListServiceQuotas
              - servicequotas:GetServiceQuota
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListRequestedServiceQuotaChangeHistory
              - servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota
              - servicequotas:GetRequestedServiceQuotaChange
              - servicequotas:RequestServiceQuotaIncrease
              - servicequotas:CreateSupportCase
            Resource: '*'
          - Sid: CloudWatchUsageMetrics
            Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
            Resource: '*'

  # database-migration-service-expertise: adds dms:TestConnection
  PolicyDmsOperationReview:
    Type: AWS::IAM::Policy
    Condition: SkillDmsOperationReview
    Properties:
      PolicyName: DevOpsAgentSkill-DmsOperationReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DmsTestConnection
            Effect: Allow
            Action:
              - dms:TestConnection
            Resource: '*'

  # aws-backup-coverage-review: only the read actions NOT already granted by
  # AIDevOpsAgentAccessPolicy. Verified with iam:SimulatePrincipalPolicy against a
  # live agent role — 45 of the 52 actions the skill uses are already allowed by
  # the managed policy, including every backup:List*/Describe* call. Strictly
  # read-only; no Start*, Put*, Create*, Update*, or Delete* is granted, and the
  # managed policy already implicitly denies backup:StartBackupJob and
  # backup:DeleteRecoveryPoint.
  # sts:GetCallerIdentity is intentionally omitted: it requires no IAM permission.
  PolicyAwsBackupCoverageReview:
    Type: AWS::IAM::Policy
    Condition: SkillAwsBackupCoverageReview
    Properties:
      PolicyName: DevOpsAgentSkill-AwsBackupCoverageReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BackupCoverageReviewDelta
            Effect: Allow
            Action:
              # Not covered by backup:List*/backup:Describe* in the managed policy
              - backup:GetSupportedResourceTypes
              # Managed policy grants SelectAggregateResourceConfig but not the
              # single-account variant the skill uses when no aggregator exists
              - config:SelectResourceConfig
              # Resource types with no inventory read in the managed policy
              - dsql:ListClusters
              - storagegateway:ListFileShares
              - storagegateway:ListGateways
              - storagegateway:ListVolumes
            Resource: '*'

  # agentcore-observability-setup: adds read-only AgentCore control-plane, X-Ray Transaction Search,
  # log-delivery/resource-policy describes, and Lambda/ECS/EKS host-config reads (Tier 2 + Tier 3).
  # Tier 1 (CloudWatch Logs/Metrics telemetry-arrival reads) is covered by AIDevOpsAgentAccessPolicy.
  PolicyAgentCoreObservabilitySetup:
    Type: AWS::IAM::Policy
    Condition: SkillAgentCoreObservabilitySetup
    Properties:
      PolicyName: DevOpsAgentSkill-AgentCoreObservabilitySetup
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AgentCoreRuntimeConfigRead
            Effect: Allow
            Action:
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListAgentRuntimes
            Resource: '*'
          - Sid: XRayTransactionSearchAndDeliveries
            Effect: Allow
            Action:
              - xray:GetTraceSegmentDestination
              - logs:DescribeDeliveries
              - logs:DescribeDeliverySources
              - logs:DescribeDeliveryDestinations
              - logs:DescribeResourcePolicies
            Resource: '*'
          - Sid: NonRuntimeHostConfigRead
            Effect: Allow
            Action:
              - lambda:GetFunctionConfiguration
              - ecs:DescribeTaskDefinition
              - ecs:DescribeServices
              - ecs:ListTasks
              - eks:DescribeCluster
            Resource: '*'
  
  # agentcore-ops-review: adds read-only bedrock-agentcore control-plane (runtime,
  # memory, gateway, browser, code-interpreter, workload-identity inventory) plus
  # ec2:DescribeSubnets for the single-AZ runtime check (AC-RUN-2). CloudWatch metric,
  # Cost Explorer, and Health reads used by the skill are covered by AIDevOpsAgentAccessPolicy.
  # Observability-only mode requires none of these — it runs on the base policy alone.
  PolicyAgentCoreOpsReview:
    Type: AWS::IAM::Policy
    Condition: SkillAgentCoreOpsReview
    Properties:
      PolicyName: DevOpsAgentSkill-AgentCoreOpsReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AgentCoreOpsReviewControlPlaneRead
            Effect: Allow
            Action:
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListAgentRuntimeEndpoints
              - bedrock-agentcore:ListAgentRuntimeVersions
              - bedrock-agentcore:ListMemories
              - bedrock-agentcore:GetMemory
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:GetGateway
              - bedrock-agentcore:ListGatewayTargets
              - bedrock-agentcore:GetGatewayTarget
              - bedrock-agentcore:ListBrowsers
              - bedrock-agentcore:ListCodeInterpreters
              - bedrock-agentcore:ListWorkloadIdentities
            Resource: '*'
          # Data-plane: used ONLY to count long-term memory records (AC-MEM-2).
          # The response can include PII-bearing memory `content`; the skill reads
          # only the count and never parses/stores/reproduces `content`. Omit this
          # statement for zero data-plane access — AC-MEM-2 degrades to a visibility
          # limit and all other memory checks (CloudWatch metrics) still work.
          - Sid: AgentCoreOpsReviewMemoryRecordCount
            Effect: Allow
            Action:
              - bedrock-agentcore:ListMemoryRecords
            Resource: '*'
          - Sid: AgentCoreOpsReviewSubnetAZResolution
            Effect: Allow
            Action:
              - ec2:DescribeSubnets
            Resource: '*'

  # Optional add-on for config-cost-optimization: the Athena CI-driver attribution path.
  # OFF by default (EnableConfigAthenaCiAnalysis=false). Athena alone (StartQueryExecution/
  # GetQueryResults) is not enough to query the Config S3 data: the query engine must read
  # the Config objects (s3:GetObject), resolve the table via the Glue Data Catalog
  # (glue:GetTable/GetDatabase/GetPartitions), and read workgroup config (athena:GetWorkGroup).
  # It ALSO requires an Athena workgroup configured with Athena-managed query results, because
  # the DevOps Agent role has no s3:PutObject to write results to a customer bucket. Without
  # all of this the path returns AccessDenied and the skill falls back to
  # GetDiscoveredResourceCounts. Scope ConfigDataBucketArn to the Config delivery bucket.
  PolicyConfigAthenaCiAnalysis:
    Type: AWS::IAM::Policy
    Condition: ConfigAthenaCiAnalysis
    Properties:
      PolicyName: DevOpsAgentSkill-ConfigAthenaCiAnalysis
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AthenaQueryExecution
            Effect: Allow
            Action:
              - athena:StartQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - athena:GetWorkGroup
            Resource: '*'
          - Sid: GlueCatalogRead
            Effect: Allow
            Action:
              - glue:GetDatabase
              - glue:GetTable
              - glue:GetPartitions
            Resource: '*'
          - Sid: ConfigDataRead
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !If
              - HasConfigDataBucketArn
              - !Sub '${ConfigDataBucketArn}/*'
              - '*'

  # Optional: restrict agent to specific regions
  PolicyRegionalRestriction:
    Type: AWS::IAM::Policy
    Condition: HasRegionRestriction
    Properties:
      PolicyName: DevOpsAgent-RegionalRestriction
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyOutOfScopeRegions
            Effect: Deny
            Action: '*'
            Resource: '*'
            Condition:
              StringNotEquals:
                aws:RequestedRegion: !Ref AllowedRegions
              'ForAnyValue:StringNotLike':
                aws:PrincipalServiceNamesList:
                  - health.amazonaws.com
                  - support.amazonaws.com
                  - ce.amazonaws.com


  # sagemaker-ai-ops-review: adds savingsplans:DescribeSavingsPlans for the Savings Plan check.
  # Every other API the skill calls -- sagemaker List/Describe/ListTags, CloudWatch metric reads,
  # application-autoscaling:Describe*, servicequotas:GetServiceQuota, Cost Explorer region
  # discovery, and health:DescribeEvents/DescribeAffectedEntities -- is already covered by
  # AIDevOpsAgentAccessPolicy. Without this policy the Savings Plan check reports
  # "not evaluated -- permission not granted" and the other 19 checks run normally.
  PolicySageMakerAIOpsReview:
    Type: AWS::IAM::Policy
    Condition: SkillSageMakerAIOpsReview
    Properties:
      PolicyName: DevOpsAgentSkill-SageMakerAIOpsReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SageMakerAIOpsReviewSavingsPlansRead
            Effect: Allow
            Action:
              - savingsplans:DescribeSavingsPlans
            Resource: '*'

  # aws-fsxn-operations-review: strictly read-only FSx for NetApp ONTAP review.
  # Grants the skill's full read set (fsx control-plane Describe*/ListTagsForResource,
  # CloudWatch metric/alarm reads, backup protected-resource/recovery-point lists, and
  # ec2 network describes for the security/networking checks). No Start*, Put*, Create*,
  # Update*, or Delete* is granted. sts:GetCallerIdentity is intentionally omitted — it
  # requires no IAM permission. These actions were NOT delta-trimmed against
  # AIDevOpsAgentAccessPolicy with iam:SimulatePrincipalPolicy; a maintainer may remove
  # any already covered by the managed policy (e.g. backup:List*, cloudwatch reads).
  PolicyAwsFsxnOperationsReview:
    Type: AWS::IAM::Policy
    Condition: SkillAwsFsxnOperationsReview
    Properties:
      PolicyName: DevOpsAgentSkill-AwsFsxnOperationsReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: FsxnOperationsReviewReadOnly
            Effect: Allow
            Action:
              - fsx:DescribeFileSystems
              - fsx:DescribeVolumes
              - fsx:DescribeStorageVirtualMachines
              - fsx:DescribeSnapshots
              - fsx:DescribeBackups
              - fsx:ListTagsForResource
              - cloudwatch:DescribeAlarms
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - backup:ListProtectedResources
              - backup:ListRecoveryPointsByResource
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeRouteTables
            Resource: '*'

Outputs:
  DevOpsAgentRoleArn:
    Description: Role ARN to use with aws devops-agent associate-service.
    Value: !If
      - CreateNewRole
      - !GetAtt DevOpsAgentRole.Arn
      - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ExistingRoleName}'

  DevOpsAgentRoleName:
    Description: Role name.
    Value: !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]

  SkillPolicySummary:
    Description: Policies applied per skill.
    Value: !Sub |
      Skills with inline policies added:
        - aws-health-events: ${EnableAwsHealthEvents} (health:DescribeEventTypes)
        - support-cases: ${EnableSupportCases} (support:DescribeCommunications)
        - rds-operation-review: ${EnableRdsOperationReview} (rds:DownloadDBLogFilePortion, logs:GetLogEvents)
        - ecs-operation-review: ${EnableEcsOperationReview} (compute-optimizer:GetECSServiceRecommendations)
        - investigation-cost-guardrail: ${EnableInvestigationCostGuardrail} (pricing:GetProducts)
        - msk-operations: ${EnableMskOperations} (kafka:GetBootstrapBrokers)
        - service-quota-check: ${EnableServiceQuotaCheck} (servicequotas:*, cloudwatch:GetMetricData/GetMetricStatistics)
        - database-migration-service-expertise: ${EnableDmsOperationReview} (dms:TestConnection)
        - aws-backup-coverage-review: ${EnableAwsBackupCoverageReview} (backup:GetSupportedResourceTypes, config:SelectResourceConfig, dsql:ListClusters, storagegateway:List*)
        - agentcore-observability-setup: ${EnableAgentCoreObservabilitySetup} (bedrock-agentcore:Get/ListAgentRuntime, xray:GetTraceSegmentDestination, logs:DescribeDeliveries/DeliverySources/DeliveryDestinations/ResourcePolicies, lambda:GetFunctionConfiguration, ecs:DescribeTaskDefinition/DescribeServices/ListTasks, eks:DescribeCluster)
        - agentcore-ops-review: ${EnableAgentCoreOpsReview} (bedrock-agentcore read-only List/Get for runtimes/memories/gateways/browsers/code-interpreters/workload-identities, ec2:DescribeSubnets)
        - config-cost-optimization Athena add-on: ${EnableConfigAthenaCiAnalysis} (athena:StartQueryExecution/GetQueryExecution/GetQueryResults, s3:GetObject on the Config data bucket; also needs an Athena-managed-results workgroup. Glue reads and athena:GetWorkGroup are already in the managed policy)
        - sagemaker-ai-ops-review: ${EnableSageMakerAIOpsReview} (savingsplans:DescribeSavingsPlans)
        - aws-fsxn-operations-review: ${EnableAwsFsxnOperationsReview} (fsx:Describe*/ListTagsForResource, cloudwatch:DescribeAlarms/GetMetricData/GetMetricStatistics/ListMetrics, backup:ListProtectedResources/ListRecoveryPointsByResource, ec2:DescribeSecurityGroups/Subnets/RouteTables)
      Skills covered by AIDevOpsAgentAccessPolicy (no extra policy needed):
        - aws-eks-operations-review, eks-upgrade-readiness, enrich-with-aws-security-agent, crm-production-investigation-guidelines
        - cloudtrail-cost-optimization, config-cost-optimization, guardduty-cost-optimization (ce:Get* and s3:GetLifecycleConfiguration already granted on * by the managed policy)
      No IAM required:
        - skip-scheduled-maintenance
