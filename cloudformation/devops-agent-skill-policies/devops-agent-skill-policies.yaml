AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Adds skill-specific IAM inline policies to a DevOps Agent role.
  Provide ExistingRoleName to attach policies to an existing role, or leave
  empty to create a new role with AIDevOpsAgentAccessPolicy attached.
  Does NOT create an Agent Space — deploy the space separately and associate
  the role ARN from this stack's output.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Role Configuration
        Parameters:
          - ExistingRoleName
      - Label:
          default: Skill Activation
        Parameters:
          - EnableAwsHealthEvents
          - EnableSupportCases
          - EnableRdsOperationReview
          - EnableEksOperationReview
          - EnableEcsOperationReview
          - EnableInvestigationCostGuardrail
          - EnableEnrichWithSecurityAgent
          - EnableCrmInvestigationGuidelines
          - EnableSkipScheduledMaintenance
          - EnableMskOperations
          - EnableServiceQuotaCheck
          - EnableDmsOperationReview
          - EnableAwsBackupCoverageReview
          - EnableAuroraIncidentBusinessContext
          - EnableAgentCoreObservabilitySetup
          - EnableAgentCoreOpsReview
          - EnableSageMakerAIOpsReview
          - EnableAwsFsxnOperationsReview
          - EnableEosCostAnalysis
          - EnableOpsaiBedrockAgentCore
          - EnableOpsaiBedrockReview
          - EnableOpsaiBedrockSecurity
          - EnableOpsaiCapacityCost
          - EnableOpsaiMlEvalCheck
          - EnableOpsaiIncidentTriage
          - EnableStorageEbsOperations
      - Label:
          default: Optional Resource Scoping
        Parameters:
          - AllowedRegions
      - Label:
          default: Optional Add-On Permissions
        Parameters:
          - EnableConfigAthenaCiAnalysis
          - EnableSsmAutomationExecutionRead

Parameters:
  ExistingRoleName:
    Type: String
    Description: >
      Name of an existing DevOps Agent role. Leave empty to create a new one.
    Default: ''

  AllowedRegions:
    Type: CommaDelimitedList
    Description: >
      (Optional) Restrict agent to these regions. Leave empty for all regions.
    Default: ''

  EnableAwsHealthEvents:
    Type: String
    Description: AWS Health Events skill (requires Business/Enterprise Support).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableSupportCases:
    Type: String
    Description: Support Cases skill (requires Business/Enterprise Support).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableRdsOperationReview:
    Type: String
    Description: RDS Operation Review skill.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableEksOperationReview:
    Type: String
    Description: EKS Operation Review skill (covered by managed policy).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableEcsOperationReview:
    Type: String
    Description: ECS Operation Review skill (adds compute-optimizer:GetECSServiceRecommendations for the PERF8 rightsizing check).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableInvestigationCostGuardrail:
    Type: String
    Description: Investigation Cost Guardrail skill.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableEnrichWithSecurityAgent:
    Type: String
    Description: Enrich with AWS Security Agent skill (covered by managed policy).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableCrmInvestigationGuidelines:
    Type: String
    Description: CRM Production Investigation Guidelines skill (covered by managed policy).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableSkipScheduledMaintenance:
    Type: String
    Description: Skip Scheduled Maintenance skill (no IAM needed).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableMskOperations:
    Type: String
    Description: MSK Operations skill (adds kafka:GetBootstrapBrokers).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableServiceQuotaCheck:
    Type: String
    Description: Service Quota Check skill (Service Quotas + CloudWatch).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableDmsOperationReview:
    Type: String
    Description: DMS Operational Review skill (adds dms:TestConnection).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableAwsBackupCoverageReview:
    Type: String
    Description: >
      AWS Backup Coverage Review skill (adds backup:GetSupportedResourceTypes,
      config:SelectResourceConfig, dsql:ListClusters, storagegateway:List*).
    AllowedValues: ['true', 'false']
    Default: 'true'
  EnableAuroraIncidentBusinessContext:
    Type: String
    Description: >
      Aurora Incident Business Context skill (adds config:GetResourceConfigHistory
      for the recent-change check).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableAgentCoreObservabilitySetup:
    Type: String
    Description: AgentCore Observability Setup skill (adds read-only bedrock-agentcore, X-Ray, log-delivery, and Lambda/ECS/EKS host-config permissions).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableAgentCoreOpsReview:
    Type: String
    Description: AgentCore Operational Review skill (adds read-only bedrock-agentcore control-plane List/Get and ec2:DescribeSubnets for the multi-AZ check; observability-only mode needs none of these).
    AllowedValues: ['true', 'false']
    Default: 'true'
  EnableSageMakerAIOpsReview:
    Type: String
    Description: SageMaker AI Operational Review skill (adds savingsplans:DescribeSavingsPlans for the Savings Plan check).
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableAwsFsxnOperationsReview:
    Type: String
    Description: >
      Amazon FSx for NetApp ONTAP Operational Review skill (read-only: adds
      fsx:Describe*/ListTagsForResource, cloudwatch metric/alarm reads,
      backup:ListProtectedResources/ListRecoveryPointsByResource, and
      ec2:DescribeSecurityGroups/NetworkInterfaces/Subnets/RouteTables).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableLiveStreamingEventReadinessReview:
    Type: String
    Description: Live-streaming event readiness review skill (adds mediatailor read-only for CDN7 SSAI discovery and route53-recovery-cluster:ListRoutingControls for RES2 ARC sub-TTL shed).
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableConfigAthenaCiAnalysis:
    Type: String
    Description: >
      Optional add-on for the config-cost-optimization skill: grants the extra permissions
      the Athena CI-driver attribution path needs (athena query execution + results, Glue
      Data Catalog reads, and s3:GetObject on the Config delivery data). OFF by default and
      least-privilege. Also requires an Athena
      workgroup configured with Athena-managed query results, because the DevOps Agent role
      has no s3:PutObject to write results to a customer bucket. Without this add-on the
      skill falls back to GetDiscoveredResourceCounts (labeled approximate) and the Athena
      path returns AccessDenied. Set ConfigDataBucketArn to scope the s3:GetObject grant to
      the Config delivery bucket; leave it at '*' only for testing.
    AllowedValues: ['true', 'false']
    Default: 'false'

  ConfigDataBucketArn:
    Type: String
    Description: >
      Bucket ARN holding the AWS Config delivery data that Athena queries (e.g.
      arn:aws:s3:::my-config-bucket). Used only when EnableConfigAthenaCiAnalysis=true to
      scope s3:GetObject to that bucket. Leave empty to grant s3:GetObject on all buckets
      (testing only — not recommended).
    Default: ''

  EnableEosCostAnalysis:
    Type: String
    Description: >
      EOS Cost Analysis skill. Resource discovery (EKS/RDS/Lambda/ElastiCache/OpenSearch
      read-only) is already covered by AIDevOpsAgentAccessPolicy; this parameter adds only
      the AWS Pricing API permissions for live Extended Support pricing.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableOpsaiBedrockAgentCore:
    Type: String
    Description: >
      opsai-bedrock-agentcore skill. Bedrock Agents Classic, IAM policy, Organizations, EC2,
      Lambda, CloudWatch and Logs reads are already covered by AIDevOpsAgentAccessPolicy; this
      parameter adds the bedrock-agentcore List/Get reads for runtimes, endpoints, gateways and
      targets, memories, browser and code interpreter sessions and resource policies, plus
      bedrock:GetPrompt. Metadata only.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableOpsaiBedrockReview:
    Type: String
    Description: >
      opsai-bedrock-review skill. Bedrock model, logging, Knowledge Base, IAM policy, CloudWatch
      and Logs reads are already covered by AIDevOpsAgentAccessPolicy; this parameter adds
      bedrock:GetIngestionJob, bedrock:GetFoundationModelAvailability and s3:GetBucketPolicyStatus,
      plus the bedrock-agentcore runtime and gateway List/Get reads for the AgentCore status hand-off.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableOpsaiBedrockSecurity:
    Type: String
    Description: >
      opsai-bedrock-security skill. Adds the IAM credential and policy reads the caller audit needs
      (account summary, credential report, access keys and last use, service-specific credentials,
      MFA devices, authorization details, context keys) and bedrock:GetFlow / bedrock:GetAgentVersion
      for guardrail resolution, plus the bedrock-agentcore runtime and gateway List/Get reads for the
      AgentCore status hand-off. No Organizations or STS action.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableOpsaiCapacityCost:
    Type: String
    Description: >
      opsai-capacity-cost skill. Bedrock, Cost Explorer, CloudWatch, Logs Insights,
      Service Quotas and s3:GetLifecycleConfiguration reads are already covered by
      AIDevOpsAgentAccessPolicy; this parameter adds only pricing:GetProducts (published
      per-token prices for the estimated-cost cross-check; a metadata read, no account data) and
      the bedrock-agentcore runtime and gateway List/Get reads for the AgentCore status hand-off.
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableOpsaiMlEvalCheck:
    Type: String
    Description: >
      opsai-ml-eval-check skill. Bedrock evaluation listing, invocation-log, CloudWatch, SageMaker
      and S3 listing reads are already covered by AIDevOpsAgentAccessPolicy; this parameter adds
      only bedrock:GetEvaluationJob (evaluation job configuration and failure messages).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableOpsaiIncidentTriage:
    Type: String
    Description: >
      opsai-incident-triage skill. Health, CloudWatch, Logs, CloudTrail, Bedrock model, agent and
      knowledge base, IAM policy and Organizations reads are already covered by
      AIDevOpsAgentAccessPolicy; this parameter adds bedrock:GetFoundationModelAvailability,
      bedrock:GetIngestionJob and the bedrock-agentcore runtime and gateway List/Get reads.
      Metadata only.
    AllowedValues: ['true', 'false']
    Default: 'true'
  EnableStorageEbsOperations:
    Type: String
    Description: >
      Amazon EBS Operations skill (adds read-only ec2:GetEbsEncryptionByDefault/GetEbsDefaultKmsKeyId,
      dlm:GetLifecyclePolicies/GetLifecyclePolicy, rbin:ListRules/GetRule, fis:GetExperiment, and
      compute-optimizer:GetEBSVolumeRecommendations).
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableSsmAutomationExecutionRead:
    Type: String
    Description: >
      Optional add-on for the aws-systems-manager custom agent: grants read-only
      ssm:GetAutomationExecution so the agent can inspect the per-location rate-control and
      alarm settings (TargetLocations) of multi-account Automation executions, which
      DescribeAutomationExecutions does not return. OFF by default. Without it the agent
      still detects multi-account runs and reports their per-location checks as Not checked.
      The aws-systems-manager skill itself needs no extra permissions.
    AllowedValues: ['true', 'false']
    Default: 'false'

Conditions:
  CreateNewRole: !Equals [!Ref ExistingRoleName, '']
  SkillAwsHealthEvents: !Equals [!Ref EnableAwsHealthEvents, 'true']
  SkillSupportCases: !Equals [!Ref EnableSupportCases, 'true']
  SkillRdsOperationReview: !Equals [!Ref EnableRdsOperationReview, 'true']
  SkillEcsOperationReview: !Equals [!Ref EnableEcsOperationReview, 'true']
  SkillInvestigationCostGuardrail: !Equals [!Ref EnableInvestigationCostGuardrail, 'true']
  SkillMskOperations: !Equals [!Ref EnableMskOperations, 'true']
  SkillServiceQuotaCheck: !Equals [!Ref EnableServiceQuotaCheck, 'true']
  SkillDmsOperationReview: !Equals [!Ref EnableDmsOperationReview, 'true']
  SkillAwsBackupCoverageReview: !Equals [!Ref EnableAwsBackupCoverageReview, 'true']
  SkillAuroraIncidentBusinessContext: !Equals [!Ref EnableAuroraIncidentBusinessContext, 'true']
  SkillAgentCoreObservabilitySetup: !Equals [!Ref EnableAgentCoreObservabilitySetup, 'true']
  SkillAgentCoreOpsReview: !Equals [!Ref EnableAgentCoreOpsReview, 'true']
  SkillSageMakerAIOpsReview: !Equals [!Ref EnableSageMakerAIOpsReview, 'true']
  SkillAwsFsxnOperationsReview: !Equals [!Ref EnableAwsFsxnOperationsReview, 'true']
  SkillLiveStreamingEventReadinessReview: !Equals [!Ref EnableLiveStreamingEventReadinessReview, 'true']
  SkillEosCostAnalysis: !Equals [!Ref EnableEosCostAnalysis, 'true']
  SkillOpsaiBedrockAgentCore: !Equals [!Ref EnableOpsaiBedrockAgentCore, 'true']
  SkillOpsaiBedrockReview: !Equals [!Ref EnableOpsaiBedrockReview, 'true']
  SkillOpsaiBedrockSecurity: !Equals [!Ref EnableOpsaiBedrockSecurity, 'true']
  SkillOpsaiCapacityCost: !Equals [!Ref EnableOpsaiCapacityCost, 'true']
  SkillOpsaiMlEvalCheck: !Equals [!Ref EnableOpsaiMlEvalCheck, 'true']
  SkillOpsaiIncidentTriage: !Equals [!Ref EnableOpsaiIncidentTriage, 'true']
  SkillStorageEbsOperations: !Equals [!Ref EnableStorageEbsOperations, 'true']
  ConfigAthenaCiAnalysis: !Equals [!Ref EnableConfigAthenaCiAnalysis, 'true']
  SsmAutomationExecutionRead: !Equals [!Ref EnableSsmAutomationExecutionRead, 'true']
  HasConfigDataBucketArn: !Not [!Equals [!Ref ConfigDataBucketArn, '']]
  HasRegionRestriction: !Not [!Equals [!Join ['', !Ref AllowedRegions], '']]

Resources:
  # New role — only created when ExistingRoleName is empty
  DevOpsAgentRole:
    Type: AWS::IAM::Role
    Condition: CreateNewRole
    Properties:
      RoleName: DevOpsAgentRole-AgentSpace
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: aidevops.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:aidevops:*:${AWS::AccountId}:agentspace/*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AIDevOpsAgentAccessPolicy
      Tags:
        - Key: ManagedBy
          Value: CloudFormation

  # Required for topology discovery
  PolicyResourceExplorerSLR:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AllowCreateResourceExplorerSLR
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCreateServiceLinkedRoles
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/resource-explorer-2.amazonaws.com/AWSServiceRoleForResourceExplorer'

  # aws-health-events: adds health:DescribeEventTypes
  PolicyAwsHealthEvents:
    Type: AWS::IAM::Policy
    Condition: SkillAwsHealthEvents
    Properties:
      PolicyName: DevOpsAgentSkill-AwsHealthEvents
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: HealthEventTypes
            Effect: Allow
            Action:
              - health:DescribeEventTypes
            Resource: '*'

  # support-cases: adds support:DescribeCommunications
  PolicySupportCases:
    Type: AWS::IAM::Policy
    Condition: SkillSupportCases
    Properties:
      PolicyName: DevOpsAgentSkill-SupportCases
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SupportCommunications
            Effect: Allow
            Action:
              - support:DescribeCommunications
            Resource: '*'

  # rds-operation-review: adds rds:DownloadDBLogFilePortion, logs:GetLogEvents
  PolicyRdsOperationReview:
    Type: AWS::IAM::Policy
    Condition: SkillRdsOperationReview
    Properties:
      PolicyName: DevOpsAgentSkill-RdsOperationReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RdsLogDownload
            Effect: Allow
            Action:
              - rds:DownloadDBLogFilePortion
            Resource: '*'
          - Sid: CloudWatchLogsGetEvents
            Effect: Allow
            Action:
              - logs:GetLogEvents
            Resource: '*'

  # ecs-operation-review: adds compute-optimizer:GetECSServiceRecommendations (PERF8 rightsizing);
  # every other API the skill uses is covered by AIDevOpsAgentAccessPolicy
  PolicyEcsOperationReview:
    Type: AWS::IAM::Policy
    Condition: SkillEcsOperationReview
    Properties:
      PolicyName: DevOpsAgentSkill-EcsOperationReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ComputeOptimizerEcsRecommendations
            Effect: Allow
            Action:
              - compute-optimizer:GetECSServiceRecommendations
            Resource: '*'

  # investigation-cost-guardrail: adds pricing:GetProducts
  PolicyInvestigationCostGuardrail:
    Type: AWS::IAM::Policy
    Condition: SkillInvestigationCostGuardrail
    Properties:
      PolicyName: DevOpsAgentSkill-InvestigationCostGuardrail
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PricingAccess
            Effect: Allow
            Action:
              - pricing:GetProducts
            Resource: '*'

  # msk-operations: adds kafka:GetBootstrapBrokers
  PolicyMskOperations:
    Type: AWS::IAM::Policy
    Condition: SkillMskOperations
    Properties:
      PolicyName: DevOpsAgentSkill-MskOperations
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: MskBootstrapBrokers
            Effect: Allow
            Action:
              - kafka:GetBootstrapBrokers
            Resource: '*'

  # service-quota-check: adds servicequotas:* and cloudwatch:GetMetricData/GetMetricStatistics
  PolicyServiceQuotaCheck:
    Type: AWS::IAM::Policy
    Condition: SkillServiceQuotaCheck
    Properties:
      PolicyName: DevOpsAgentSkill-ServiceQuotaCheck
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ServiceQuotasReadAndRequest
            Effect: Allow
            Action:
              - servicequotas:ListServices
              - servicequotas:ListServiceQuotas
              - servicequotas:GetServiceQuota
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListRequestedServiceQuotaChangeHistory
              - servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota
              - servicequotas:GetRequestedServiceQuotaChange
              - servicequotas:RequestServiceQuotaIncrease
              - servicequotas:CreateSupportCase
            Resource: '*'
          - Sid: CloudWatchUsageMetrics
            Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
            Resource: '*'

  # database-migration-service-expertise: adds dms:TestConnection
  PolicyDmsOperationReview:
    Type: AWS::IAM::Policy
    Condition: SkillDmsOperationReview
    Properties:
      PolicyName: DevOpsAgentSkill-DmsOperationReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DmsTestConnection
            Effect: Allow
            Action:
              - dms:TestConnection
            Resource: '*'

  # aws-backup-coverage-review: only the read actions NOT already granted by
  # AIDevOpsAgentAccessPolicy. Verified with iam:SimulatePrincipalPolicy against a
  # live agent role — 45 of the 52 actions the skill uses are already allowed by
  # the managed policy, including every backup:List*/Describe* call. Strictly
  # read-only; no Start*, Put*, Create*, Update*, or Delete* is granted, and the
  # managed policy already implicitly denies backup:StartBackupJob and
  # backup:DeleteRecoveryPoint.
  # sts:GetCallerIdentity is intentionally omitted: it requires no IAM permission.
  PolicyAwsBackupCoverageReview:
    Type: AWS::IAM::Policy
    Condition: SkillAwsBackupCoverageReview
    Properties:
      PolicyName: DevOpsAgentSkill-AwsBackupCoverageReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BackupCoverageReviewDelta
            Effect: Allow
            Action:
              # Not covered by backup:List*/backup:Describe* in the managed policy
              - backup:GetSupportedResourceTypes
              # Managed policy grants SelectAggregateResourceConfig but not the
              # single-account variant the skill uses when no aggregator exists
              - config:SelectResourceConfig
              # Resource types with no inventory read in the managed policy
              - dsql:ListClusters
              - storagegateway:ListFileShares
              - storagegateway:ListGateways
              - storagegateway:ListVolumes
            Resource: '*'

  # aurora-incident-business-context: AIDevOpsAgentAccessPolicy already grants the
  # skill's rds:List*, tag:GetResources and cloudtrail:LookupEvents calls. Its AWS
  # Config grant covers Describe*/List* and the aggregate reads but not the
  # single-resource history the recent-change check uses. Read-only.
  PolicyAuroraIncidentBusinessContext:
    Type: AWS::IAM::Policy
    Condition: SkillAuroraIncidentBusinessContext
    Properties:
      PolicyName: DevOpsAgentSkill-AuroraIncidentBusinessContext
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AuroraIncidentBusinessContextDelta
            Effect: Allow
            Action:
              # Configuration timeline for the cluster and its parameter group
              - config:GetResourceConfigHistory
            Resource: '*'

  # agentcore-observability-setup: adds read-only AgentCore control-plane, X-Ray Transaction Search,
  # log-delivery/resource-policy describes, and Lambda/ECS/EKS host-config reads (Tier 2 + Tier 3).
  # Tier 1 (CloudWatch Logs/Metrics telemetry-arrival reads) is covered by AIDevOpsAgentAccessPolicy.
  PolicyAgentCoreObservabilitySetup:
    Type: AWS::IAM::Policy
    Condition: SkillAgentCoreObservabilitySetup
    Properties:
      PolicyName: DevOpsAgentSkill-AgentCoreObservabilitySetup
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AgentCoreRuntimeConfigRead
            Effect: Allow
            Action:
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListAgentRuntimes
            Resource: '*'
          - Sid: XRayTransactionSearchAndDeliveries
            Effect: Allow
            Action:
              - xray:GetTraceSegmentDestination
              - logs:DescribeDeliveries
              - logs:DescribeDeliverySources
              - logs:DescribeDeliveryDestinations
              - logs:DescribeResourcePolicies
            Resource: '*'
          - Sid: NonRuntimeHostConfigRead
            Effect: Allow
            Action:
              - lambda:GetFunctionConfiguration
              - ecs:DescribeTaskDefinition
              - ecs:DescribeServices
              - ecs:ListTasks
              - eks:DescribeCluster
            Resource: '*'
  
  # agentcore-ops-review: adds read-only bedrock-agentcore control-plane (runtime,
  # memory, gateway, browser, code-interpreter, workload-identity inventory) plus
  # ec2:DescribeSubnets for the single-AZ runtime check (AC-RUN-2). CloudWatch metric,
  # Cost Explorer, and Health reads used by the skill are covered by AIDevOpsAgentAccessPolicy.
  # Observability-only mode requires none of these — it runs on the base policy alone.
  PolicyAgentCoreOpsReview:
    Type: AWS::IAM::Policy
    Condition: SkillAgentCoreOpsReview
    Properties:
      PolicyName: DevOpsAgentSkill-AgentCoreOpsReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AgentCoreOpsReviewControlPlaneRead
            Effect: Allow
            Action:
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListAgentRuntimeEndpoints
              - bedrock-agentcore:ListAgentRuntimeVersions
              - bedrock-agentcore:ListMemories
              - bedrock-agentcore:GetMemory
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:GetGateway
              - bedrock-agentcore:ListGatewayTargets
              - bedrock-agentcore:GetGatewayTarget
              - bedrock-agentcore:ListBrowsers
              - bedrock-agentcore:ListCodeInterpreters
              - bedrock-agentcore:ListWorkloadIdentities
            Resource: '*'
          # Data-plane: used ONLY to count long-term memory records (AC-MEM-2).
          # The response can include PII-bearing memory `content`; the skill reads
          # only the count and never parses/stores/reproduces `content`. Omit this
          # statement for zero data-plane access — AC-MEM-2 degrades to a visibility
          # limit and all other memory checks (CloudWatch metrics) still work.
          - Sid: AgentCoreOpsReviewMemoryRecordCount
            Effect: Allow
            Action:
              - bedrock-agentcore:ListMemoryRecords
            Resource: '*'
          - Sid: AgentCoreOpsReviewSubnetAZResolution
            Effect: Allow
            Action:
              - ec2:DescribeSubnets
            Resource: '*'

  # Optional add-on for config-cost-optimization: the Athena CI-driver attribution path.
  # OFF by default (EnableConfigAthenaCiAnalysis=false). Athena alone (StartQueryExecution/
  # GetQueryResults) is not enough to query the Config S3 data: the query engine must read
  # the Config objects (s3:GetObject), resolve the table via the Glue Data Catalog
  # (glue:GetTable/GetDatabase/GetPartitions), and read workgroup config (athena:GetWorkGroup).
  # It ALSO requires an Athena workgroup configured with Athena-managed query results, because
  # the DevOps Agent role has no s3:PutObject to write results to a customer bucket. Without
  # all of this the path returns AccessDenied and the skill falls back to
  # GetDiscoveredResourceCounts. Scope ConfigDataBucketArn to the Config delivery bucket.
  PolicyConfigAthenaCiAnalysis:
    Type: AWS::IAM::Policy
    Condition: ConfigAthenaCiAnalysis
    Properties:
      PolicyName: DevOpsAgentSkill-ConfigAthenaCiAnalysis
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AthenaQueryExecution
            Effect: Allow
            Action:
              - athena:StartQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - athena:GetWorkGroup
            Resource: '*'
          - Sid: GlueCatalogRead
            Effect: Allow
            Action:
              - glue:GetDatabase
              - glue:GetTable
              - glue:GetPartitions
            Resource: '*'
          - Sid: ConfigDataRead
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !If
              - HasConfigDataBucketArn
              - !Sub '${ConfigDataBucketArn}/*'
              - '*'

  # eos-cost-analysis: adds ONLY the AWS Pricing API permissions for live Extended Support
  # pricing. Resource discovery (eks:ListClusters/DescribeCluster, rds:DescribeDBInstances/
  # DescribeDBClusters, lambda:ListFunctions, elasticache:DescribeCacheClusters/
  # DescribeReplicationGroups/DescribeServerlessCaches, es:ListDomainNames/DescribeDomain/
  # DescribeDomains) is already granted by AIDevOpsAgentAccessPolicy, so no discovery
  # statement is added here.
  PolicyEosCostAnalysis:
    Type: AWS::IAM::Policy
    Condition: SkillEosCostAnalysis
    Properties:
      PolicyName: DevOpsAgentSkill-EosCostAnalysis
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EosPricingApi
            Effect: Allow
            Action:
              - pricing:GetProducts
              - pricing:GetAttributeValues
              - pricing:DescribeServices
            Resource: '*'

  # opsai-bedrock-agentcore: AIDevOpsAgentAccessPolicy (v16) has no bedrock-agentcore action and
  # not bedrock:GetPrompt; it already covers the Bedrock Agents Classic reads (bedrock:Get*/List* for
  # agents, aliases, action groups), iam:GetRole/GetRolePolicy/GetPolicyVersion/List*RolePolicies,
  # organizations:ListPoliciesForTarget/DescribePolicy, ec2:DescribeVpcEndpoints, lambda:GetPolicy,
  # cloudwatch:GetMetricData and logs:StartQuery. Metadata only: no Invoke*, no memory records, no
  # session content. Left out: iam:SimulatePrincipalPolicy (the agent runtime refuses it even when
  # granted; the skill reads the policy documents instead and labels the verdict "evaluated from
  # policy documents, not simulated"). Left out: s3:GetObject (returns customer data). Without this policy an AgentCore read is reported as a disclosed
  # permission gap, never as an absent runtime.
  PolicyOpsaiBedrockAgentCore:
    Type: AWS::IAM::Policy
    Condition: SkillOpsaiBedrockAgentCore
    Properties:
      PolicyName: DevOpsAgentSkill-OpsaiBedrockAgentCore
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OpsaiBedrockAgentCoreControlPlaneRead
            Effect: Allow
            Action:
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListAgentRuntimeEndpoints
              - bedrock-agentcore:ListAgentRuntimeVersions
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:GetGateway
              - bedrock-agentcore:ListGatewayTargets
              - bedrock-agentcore:GetGatewayTarget
              - bedrock-agentcore:ListMemories
              - bedrock-agentcore:GetMemory
              - bedrock-agentcore:ListBrowsers
              - bedrock-agentcore:ListBrowserSessions
              - bedrock-agentcore:GetBrowserSession
              - bedrock-agentcore:ListCodeInterpreters
              - bedrock-agentcore:ListCodeInterpreterSessions
              - bedrock-agentcore:GetCodeInterpreterSession
              - bedrock-agentcore:GetResourcePolicy
            Resource: '*'
          - Sid: OpsaiBedrockAgentCorePromptRead
            Effect: Allow
            Action:
              - bedrock:GetPrompt
            Resource: '*'

  # opsai-bedrock-review: adds the three reads AIDevOpsAgentAccessPolicy (v16) lacks.
  # bedrock:GetIngestionJob (job status, statistics and failure reasons) and
  # bedrock:GetFoundationModelAvailability (model access agreement state) are metadata reads;
  # s3:GetBucketPolicyStatus reports whether the invocation-log bucket is public. Every other read
  # (bedrock:Get*/List* for models, logging, knowledge bases and data sources, IAM policy reads,
  # organizations, cloudtrail:LookupEvents, CloudWatch, Logs, aoss, servicequotas and S3 bucket
  # configuration) is already granted. Left out: bedrock:Retrieve (returns chunk text; the optional
  # probe stays a customer choice), s3:GetObject (returns customer data) and
  # iam:SimulatePrincipalPolicy (refused by the agent runtime; the skill reads the policy
  # documents). Without this policy ingestion statistics come from ListIngestionJobs, model access
  # is judged from the error text and CloudTrail, and bucket exposure from GetBucketPolicy and
  # GetBucketPublicAccessBlock. The bedrock-agentcore List/Get reads for runtimes and gateways serve
  # the AgentCore status hand-off (each skill is installed on its own); without them that read is
  # a disclosed permission gap, not an absent runtime.
  PolicyOpsaiBedrockReview:
    Type: AWS::IAM::Policy
    Condition: SkillOpsaiBedrockReview
    Properties:
      PolicyName: DevOpsAgentSkill-OpsaiBedrockReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OpsaiBedrockReviewRead
            Effect: Allow
            Action:
              - bedrock:GetIngestionJob
              - bedrock:GetFoundationModelAvailability
              - s3:GetBucketPolicyStatus
            Resource: '*'
          - Sid: OpsaiBedrockReviewAgentCoreStatusRead
            Effect: Allow
            Action:
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:GetGateway
            Resource: '*'

  # opsai-bedrock-security: the caller (credential) audit and guardrail resolution. Adds the IAM
  # reads AIDevOpsAgentAccessPolicy (v16) lacks; iam:ListAccountAliases/ListUsers/GetUser/GetPolicy/
  # GetPolicyVersion and every guardrail read (bedrock:GetGuardrail, bedrock:List*, GetAgent,
  # GetAgentAlias, organizations:DescribeEffectivePolicy, CloudWatch, Logs, kms:DescribeKey) are
  # already granted. iam:GetAccountAuthorizationDetails returns the policy documents of every IAM
  # user and group; the skill keeps only the users it evaluates. No Organizations or STS action,
  # no iam:Generate*, no Update/Create/Delete. Left out: iam:SimulatePrincipalPolicy and
  # iam:SimulateCustomPolicy (refused by the agent runtime; verdicts are read from the policy
  # documents). Without this policy an account whose authorization details or policies cannot be
  # read is reported as failed with the missing API named, an unreadable credential report is
  # disclosed, and a denied ListServiceSpecificCredentials makes the account partial. Also left out:
  # bedrock:ApplyGuardrail and bedrock:InvokeGuardrailChecks (they invoke the guardrail and are
  # billed; the skill reads bedrock:GetGuardrail instead). The bedrock-agentcore List/Get reads serve
  # the AgentCore status hand-off; without them that read is a disclosed permission gap.
  PolicyOpsaiBedrockSecurity:
    Type: AWS::IAM::Policy
    Condition: SkillOpsaiBedrockSecurity
    Properties:
      PolicyName: DevOpsAgentSkill-OpsaiBedrockSecurity
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OpsaiBedrockSecurityIamRead
            Effect: Allow
            Action:
              - iam:GetAccountSummary
              - iam:GetCredentialReport
              - iam:ListServiceSpecificCredentials
              - iam:ListAccessKeys
              - iam:GetAccessKeyLastUsed
              - iam:ListMFADevices
              - iam:GetAccountAuthorizationDetails
              - iam:GetContextKeysForPrincipalPolicy
            Resource: '*'
          - Sid: OpsaiBedrockSecurityGuardrailResolution
            Effect: Allow
            Action:
              - bedrock:GetFlow
              - bedrock:GetAgentVersion
            Resource: '*'
          - Sid: OpsaiBedrockSecurityAgentCoreStatusRead
            Effect: Allow
            Action:
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:GetGateway
            Resource: '*'

  # opsai-capacity-cost: adds ONLY pricing:GetProducts, the Price List read the skill uses to
  # price CloudWatch token counts for its (estimated) cross-check against Cost Explorer. Every
  # other read the skill makes -- bedrock:List*/GetFoundationModel/GetInferenceProfile/
  # GetProvisionedModelThroughput/GetModelInvocationLoggingConfiguration, ce:Get*/List*,
  # cloudwatch:GetMetricData/ListMetrics/DescribeAlarms, logs:Describe*/StartQuery/
  # GetQueryResults, servicequotas:Get*/List*, s3:GetLifecycleConfiguration -- is already in
  # AIDevOpsAgentAccessPolicy (v16). Metadata only: the Price List API returns published prices
  # and no account data. Without this policy the skill reads prices from the Bedrock pricing
  # page or reports the model as "unpriced: pricing:GetProducts denied"; billed figures, token
  # reconciliation, Provisioned Throughput and quota checks run unchanged. The bedrock-agentcore
  # List/Get reads for runtimes and gateways serve the AgentCore status hand-off; without them that
  # read is a disclosed permission gap.
  PolicyOpsaiCapacityCost:
    Type: AWS::IAM::Policy
    Condition: SkillOpsaiCapacityCost
    Properties:
      PolicyName: DevOpsAgentSkill-OpsaiCapacityCost
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OpsaiCapacityCostPricingRead
            Effect: Allow
            Action:
              - pricing:GetProducts
            Resource: '*'
          - Sid: OpsaiCapacityCostAgentCoreStatusRead
            Effect: Allow
            Action:
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:GetGateway
            Resource: '*'

  # opsai-ml-eval-check: adds ONLY bedrock:GetEvaluationJob (evaluation task, metrics, dataset and
  # output locations, failure messages; metadata). bedrock:ListEvaluationJobs,
  # GetModelInvocationLoggingConfiguration, logs:StartQuery/DescribeMetricFilters,
  # cloudwatch:GetMetricData/ListMetrics, sagemaker:ListTrainingJobs/DescribeTrainingJob and
  # s3:ListBucket are already in AIDevOpsAgentAccessPolicy (v16). Left out: s3:GetObject (returns
  # customer data; dataset and output checks read keys, sizes and dates only). Without this policy
  # the skill works from the ListEvaluationJobs summaries and reports the checks that need the job
  # detail as not evaluated.
  PolicyOpsaiMlEvalCheck:
    Type: AWS::IAM::Policy
    Condition: SkillOpsaiMlEvalCheck
    Properties:
      PolicyName: DevOpsAgentSkill-OpsaiMlEvalCheck
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OpsaiMlEvalCheckEvaluationJobRead
            Effect: Allow
            Action:
              - bedrock:GetEvaluationJob
            Resource: '*'

  # opsai-incident-triage: adds the reads AIDevOpsAgentAccessPolicy (v16) lacks.
  # bedrock:GetFoundationModelAvailability (model access agreement state for an AccessDenied or
  # ResourceNotFound on a non-entitled model) and bedrock:GetIngestionJob (job status, statistics and
  # failure reasons) are metadata reads; the bedrock-agentcore List/Get reads for runtimes and gateways
  # serve the AgentCore status hand-off. Every other read (health:Describe*, cloudwatch, logs,
  # cloudtrail:LookupEvents, bedrock:List*/GetAgent/GetAgentAlias/GetKnowledgeBase/GetGuardrail, IAM
  # policy reads, organizations) is already granted. Left out: iam:SimulatePrincipalPolicy (refused by
  # the agent runtime; the skill evaluates the policy documents) and bedrock:ApplyGuardrail (invokes
  # the guardrail and is billed; the skill reads bedrock:GetGuardrail). Without this policy model
  # access is judged from the error text, model lifecycle and CloudTrail, ingestion state from the
  # ListIngestionJobs summaries, and an AgentCore runtime is reported as unread, never as absent.
  PolicyOpsaiIncidentTriage:
    Type: AWS::IAM::Policy
    Condition: SkillOpsaiIncidentTriage
    Properties:
      PolicyName: DevOpsAgentSkill-OpsaiIncidentTriage
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OpsaiIncidentTriageBedrockRead
            Effect: Allow
            Action:
              - bedrock:GetFoundationModelAvailability
              - bedrock:GetIngestionJob
            Resource: '*'
          - Sid: OpsaiIncidentTriageAgentCoreStatusRead
            Effect: Allow
            Action:
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:GetGateway
            Resource: '*'

  # Optional: restrict agent to specific regions
  PolicyRegionalRestriction:
    Type: AWS::IAM::Policy
    Condition: HasRegionRestriction
    Properties:
      PolicyName: DevOpsAgent-RegionalRestriction
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyOutOfScopeRegions
            Effect: Deny
            Action: '*'
            Resource: '*'
            Condition:
              StringNotEquals:
                aws:RequestedRegion: !Ref AllowedRegions
              'ForAnyValue:StringNotLike':
                aws:PrincipalServiceNamesList:
                  - health.amazonaws.com
                  - support.amazonaws.com
                  - ce.amazonaws.com


  # sagemaker-ai-ops-review: adds savingsplans:DescribeSavingsPlans for the Savings Plan check.
  # Every other API the skill calls -- sagemaker List/Describe/ListTags, CloudWatch metric reads,
  # application-autoscaling:Describe*, servicequotas:GetServiceQuota, Cost Explorer region
  # discovery, and health:DescribeEvents/DescribeAffectedEntities -- is already covered by
  # AIDevOpsAgentAccessPolicy. Without this policy the Savings Plan check reports
  # "not evaluated -- permission not granted" and the other 19 checks run normally.
  PolicySageMakerAIOpsReview:
    Type: AWS::IAM::Policy
    Condition: SkillSageMakerAIOpsReview
    Properties:
      PolicyName: DevOpsAgentSkill-SageMakerAIOpsReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SageMakerAIOpsReviewSavingsPlansRead
            Effect: Allow
            Action:
              - savingsplans:DescribeSavingsPlans
            Resource: '*'

  # aws-fsxn-operations-review: strictly read-only FSx for NetApp ONTAP review.
  # Grants the skill's full read set (fsx control-plane Describe*/ListTagsForResource,
  # CloudWatch metric/alarm reads, backup protected-resource/recovery-point lists, and
  # ec2 network describes for the security/networking checks). No Start*, Put*, Create*,
  # Update*, or Delete* is granted. sts:GetCallerIdentity is intentionally omitted — it
  # requires no IAM permission. These actions were NOT delta-trimmed against
  # AIDevOpsAgentAccessPolicy with iam:SimulatePrincipalPolicy; a maintainer may remove
  # any already covered by the managed policy (e.g. backup:List*, cloudwatch reads).
  PolicyAwsFsxnOperationsReview:
    Type: AWS::IAM::Policy
    Condition: SkillAwsFsxnOperationsReview
    Properties:
      PolicyName: DevOpsAgentSkill-AwsFsxnOperationsReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: FsxnOperationsReviewReadOnly
            Effect: Allow
            Action:
              - fsx:DescribeFileSystems
              - fsx:DescribeVolumes
              - fsx:DescribeStorageVirtualMachines
              - fsx:DescribeSnapshots
              - fsx:DescribeBackups
              - fsx:ListTagsForResource
              - cloudwatch:DescribeAlarms
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - backup:ListProtectedResources
              - backup:ListRecoveryPointsByResource
              - ec2:DescribeSecurityGroups
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DescribeRouteTables
            Resource: '*'

  # live-streaming-event-readiness-review: adds mediatailor read-only for CDN7 (SSAI
  # playback-config discovery + PrefetchSchedule check) and
  # route53-recovery-cluster:ListRoutingControls for the RES2 Route 53 ARC sub-TTL shed
  # option. Every other API the skill calls -- CloudFront, EC2, EKS, ECS, Lambda, ELB,
  # DynamoDB, ElastiCache, RDS, Keyspaces, Route 53, FIS, CloudWatch, Health, service
  # quotas, MediaLive channel + caption outputs, MediaPackage/v2 SPEKE encryption,
  # Kinesis/Firehose/MSK, IVS -- is already covered by AIDevOpsAgentAccessPolicy or the
  # companion skills' policies (service-quota-check, msk-operations, aws-health-events,
  # support-cases). Without this policy, CDN7 and the RES2 ARC branch fall back to
  # N/A with reason (graceful degradation per the skill's applicability gates).
  PolicyLiveStreamingEventReadinessReview:
    Type: AWS::IAM::Policy
    Condition: SkillLiveStreamingEventReadinessReview
    Properties:
      PolicyName: DevOpsAgentSkill-LiveStreamingEventReadinessReview
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LseMediaTailorRead
            Effect: Allow
            Action:
              - mediatailor:ListPlaybackConfigurations
              - mediatailor:GetPlaybackConfiguration
              - mediatailor:ListPrefetchSchedules
            Resource: '*'
          - Sid: LseRoute53ArcRead
            Effect: Allow
            Action:
              - route53-recovery-cluster:ListRoutingControls
            Resource: '*'

  # storage-ebs-operations: adds only the read actions the skill uses that
  # AIDevOpsAgentAccessPolicy does not grant: the account's EBS encryption-by-default
  # settings, Amazon Data Lifecycle Manager and Recycle Bin rules (snapshot management
  # and reversibility), AWS FIS experiment details (injected-latency check), and the
  # optional Compute Optimizer EBS recommendations. Every other API the skill calls
  # (ec2:Describe*, ec2:GetSnapshotBlockPublicAccessState, CloudWatch, Service Quotas,
  # AWS Backup, AWS KMS, Cost Explorer, fis:ListExperiments, AWS Health, CloudTrail) is
  # already covered by the managed policy. Strictly read-only; no Modify*, Create*,
  # Delete* or Put* is granted. Without this policy the skill lists the denied calls
  # under Gaps and reports the dependent conclusions as unconfirmed.
  PolicyStorageEbsOperations:
    Type: AWS::IAM::Policy
    Condition: SkillStorageEbsOperations
    Properties:
      PolicyName: DevOpsAgentSkill-StorageEbsOperations
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StorageEbsOperationsReadOnly
            Effect: Allow
            Action:
              - ec2:GetEbsEncryptionByDefault
              - ec2:GetEbsDefaultKmsKeyId
              - dlm:GetLifecyclePolicies
              - dlm:GetLifecyclePolicy
              - rbin:ListRules
              - rbin:GetRule
              - fis:GetExperiment
              - compute-optimizer:GetEBSVolumeRecommendations
            Resource: '*'

  # aws-systems-manager custom agent add-on: read the per-location settings of
  # multi-account Automation executions. GetAutomationExecution is the only
  # Automation read the review needs that AIDevOpsAgentAccessPolicy does not
  # grant; it is scoped to this account's automation executions and grants no
  # write.
  PolicySsmAutomationExecutionRead:
    Type: AWS::IAM::Policy
    Condition: SsmAutomationExecutionRead
    Properties:
      PolicyName: DevOpsAgentAddOn-SsmAutomationExecutionRead
      Roles:
        - !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SsmGetAutomationExecution
            Effect: Allow
            Action:
              - ssm:GetAutomationExecution
            Resource:
              - !Sub 'arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:automation-execution/*'

Outputs:
  DevOpsAgentRoleArn:
    Description: Role ARN to use with aws devops-agent associate-service.
    Value: !If
      - CreateNewRole
      - !GetAtt DevOpsAgentRole.Arn
      - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ExistingRoleName}'

  DevOpsAgentRoleName:
    Description: Role name.
    Value: !If [CreateNewRole, !Ref DevOpsAgentRole, !Ref ExistingRoleName]

  SkillPolicySummary:
    Description: Policies applied per skill.
    Value: !Sub |
      Skills with inline policies added:
        - aws-health-events: ${EnableAwsHealthEvents} (health:DescribeEventTypes)
        - support-cases: ${EnableSupportCases} (support:DescribeCommunications)
        - rds-operation-review: ${EnableRdsOperationReview} (rds:DownloadDBLogFilePortion, logs:GetLogEvents)
        - ecs-operation-review: ${EnableEcsOperationReview} (compute-optimizer:GetECSServiceRecommendations)
        - investigation-cost-guardrail: ${EnableInvestigationCostGuardrail} (pricing:GetProducts)
        - msk-operations: ${EnableMskOperations} (kafka:GetBootstrapBrokers)
        - service-quota-check: ${EnableServiceQuotaCheck} (servicequotas:*, cloudwatch:GetMetricData/GetMetricStatistics)
        - database-migration-service-expertise: ${EnableDmsOperationReview} (dms:TestConnection)
        - aws-backup-coverage-review: ${EnableAwsBackupCoverageReview} (backup:GetSupportedResourceTypes, config:SelectResourceConfig, dsql:ListClusters, storagegateway:List*)
        - aurora-incident-business-context: ${EnableAuroraIncidentBusinessContext} (config:GetResourceConfigHistory)
        - agentcore-observability-setup: ${EnableAgentCoreObservabilitySetup} (bedrock-agentcore:GetAgentRuntime/ListAgentRuntimes, xray:GetTraceSegmentDestination, logs:DescribeDeliveries/DeliverySources/DeliveryDestinations/ResourcePolicies, lambda:GetFunctionConfiguration, ecs:DescribeTaskDefinition/DescribeServices/ListTasks, eks:DescribeCluster)
        - agentcore-ops-review: ${EnableAgentCoreOpsReview} (bedrock-agentcore read-only List/Get for runtimes/memories/gateways/browsers/code-interpreters/workload-identities, ec2:DescribeSubnets)
        - config-cost-optimization Athena add-on: ${EnableConfigAthenaCiAnalysis} (athena:StartQueryExecution/GetQueryExecution/GetQueryResults, s3:GetObject on the Config data bucket; also needs an Athena-managed-results workgroup. Glue reads and athena:GetWorkGroup are already in the managed policy)
        - sagemaker-ai-ops-review: ${EnableSageMakerAIOpsReview} (savingsplans:DescribeSavingsPlans)
        - aws-fsxn-operations-review: ${EnableAwsFsxnOperationsReview} (fsx:Describe*/ListTagsForResource, cloudwatch:DescribeAlarms/GetMetricData/GetMetricStatistics/ListMetrics, backup:ListProtectedResources/ListRecoveryPointsByResource, ec2:DescribeSecurityGroups/NetworkInterfaces/Subnets/RouteTables)
        - live-streaming-event-readiness-review: ${EnableLiveStreamingEventReadinessReview} (mediatailor:ListPlaybackConfigurations/GetPlaybackConfiguration/ListPrefetchSchedules, route53-recovery-cluster:ListRoutingControls)
        - eos-cost-analysis: ${EnableEosCostAnalysis} (pricing:GetProducts/GetAttributeValues/DescribeServices — resource discovery is covered by the managed policy)
        - opsai-bedrock-agentcore: ${EnableOpsaiBedrockAgentCore} (bedrock-agentcore List/Get for runtimes, endpoints, versions, gateways and targets, memories, browser and code interpreter sessions, GetResourcePolicy; bedrock:GetPrompt — Agents Classic, IAM, Organizations, EC2 and CloudWatch reads are covered by the managed policy)
        - opsai-bedrock-review: ${EnableOpsaiBedrockReview} (bedrock:GetIngestionJob/GetFoundationModelAvailability, s3:GetBucketPolicyStatus, bedrock-agentcore:ListAgentRuntimes/GetAgentRuntime/ListGateways/GetGateway)
        - opsai-bedrock-security: ${EnableOpsaiBedrockSecurity} (iam:GetAccountSummary/GetCredentialReport/ListServiceSpecificCredentials/ListAccessKeys/GetAccessKeyLastUsed/ListMFADevices/GetAccountAuthorizationDetails/GetContextKeysForPrincipalPolicy, bedrock:GetFlow/GetAgentVersion, bedrock-agentcore:ListAgentRuntimes/GetAgentRuntime/ListGateways/GetGateway)
        - opsai-capacity-cost: ${EnableOpsaiCapacityCost} (pricing:GetProducts, bedrock-agentcore:ListAgentRuntimes/GetAgentRuntime/ListGateways/GetGateway — Bedrock, Cost Explorer, CloudWatch, Logs, Service Quotas and s3:GetLifecycleConfiguration reads are covered by the managed policy; without it prices fall back to the pricing page or "unpriced")
        - opsai-ml-eval-check: ${EnableOpsaiMlEvalCheck} (bedrock:GetEvaluationJob)
        - opsai-incident-triage: ${EnableOpsaiIncidentTriage} (bedrock:GetFoundationModelAvailability/GetIngestionJob, bedrock-agentcore:ListAgentRuntimes/GetAgentRuntime/ListGateways/GetGateway)
        - storage-ebs-operations: ${EnableStorageEbsOperations} (ec2:GetEbsEncryptionByDefault/GetEbsDefaultKmsKeyId, dlm:GetLifecyclePolicies/GetLifecyclePolicy, rbin:ListRules/GetRule, fis:GetExperiment, compute-optimizer:GetEBSVolumeRecommendations)
        - aws-systems-manager custom agent add-on: ${EnableSsmAutomationExecutionRead} (ssm:GetAutomationExecution on this account's automation executions, for the per-location settings of multi-account runs; the aws-systems-manager skill itself needs no extra policy)
      Skills covered by AIDevOpsAgentAccessPolicy (no extra policy needed):
        - aws-eks-operations-review, eks-upgrade-readiness, enrich-with-aws-security-agent, crm-production-investigation-guidelines
        - cloudtrail-cost-optimization, config-cost-optimization, guardduty-cost-optimization (ce:Get* and s3:GetLifecycleConfiguration already granted on * by the managed policy)
        - eos-cost-analysis resource discovery (eks/rds/lambda/elasticache/es List/Describe already granted on * by the managed policy; only the Pricing API needs the add-on above)
        - opsai-sagemaker-inference, opsai-sagemaker-training (SageMaker, Service Quotas, Application Auto Scaling, CloudWatch, IAM policy and S3 listing reads already granted; they use neither s3:GetObject nor iam:SimulatePrincipalPolicy)
      No IAM required:
        - skip-scheduled-maintenance
