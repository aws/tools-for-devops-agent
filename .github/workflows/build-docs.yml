name: Build docs

# Builds the GitHub Pages site with `mkdocs build --strict` on every pull
# request, so a change that would break the site is caught before it merges
# rather than by deploy-docs.yml after it, and again after each push to `main`.
# It only builds; it deploys nothing and doesn't change the site.
#
# It installs the same hash-pinned dependencies as deploy-docs.yml, from
# .github/scripts/docs/requirements.txt, so a new release of one of them can't
# change a build until that file changes. nh3, one of them, sanitises the
# connector pages (docs/hooks/connectors_catalog.py).
#
# NOTE: advisory until an admin adds "build-docs" to the required status checks
# for `main`. Use "Require branches to be up to date before merging" with it
# rather than a merge queue: the workflow doesn't run on merge_group events.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Deliberately NOT filtered with `paths:`: a required check that never runs
    # stays pending forever.
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older build. Builds of `main` are
# never cancelled, so every push to it is built.
concurrency:
  group: build-docs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: build-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: docs/hooks/connectors_catalog.py reads a released
          # connector from the commit that carries its production version.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install mkdocs
        run: python3 -I -m pip install --require-hashes -r .github/scripts/docs/requirements.txt

      # The connector page sanitiser's tests render READMEs with the site's
      # Markdown settings, so they need what was just installed. validate-skills
      # runs the rest of the suite without it and skips them; here they must run.
      - name: Test the connectors catalog hook
        env:
          CONNECTORS_TESTS_REQUIRE_DOCS_DEPS: "1"
        run: python3 -I -m unittest discover -s tests -p test_connectors_catalog.py -v

      - name: Build the site
        run: mkdocs build --strict
