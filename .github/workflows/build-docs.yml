name: Build docs

# Builds the GitHub Pages site with `mkdocs build --strict` on every pull
# request, so a change that would break the site is caught before it merges
# rather than by deploy-docs.yml after it. It only builds; it deploys nothing and
# doesn't change the site.
#
# mkdocs-material is pinned to the same version deploy-docs.yml installs, so a
# pull request builds the site exactly as the deploy does.
#
# NOTE: advisory until an admin adds "build-docs" to the required status checks
# for `main`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Deliberately NOT filtered with `paths:`: a required check that never runs
    # stays pending forever.

permissions:
  contents: read

concurrency:
  group: build-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: build-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install mkdocs
        run: python3 -m pip install mkdocs-material==9.6.14

      - name: Build the site
        run: mkdocs build --strict
