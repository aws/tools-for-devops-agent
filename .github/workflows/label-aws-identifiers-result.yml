name: Label AWS identifier scan result

# Applies the `needs-id-redact` label to a pull request whose "Scan for AWS
# identifiers" check failed, and removes it once the check passes.
#
# `needs-id-redact` is an *output* of the check and is owned by this workflow
# alone. It is not something to add or remove by hand: this workflow rewrites it
# on every run of the check, so a hand-applied one disappears on the next push
# and a hand-removed one comes straight back.
#
# Why a separate workflow: for pull_request events from a fork, GITHUB_TOKEN is
# read-only regardless of the `permissions:` block, so the scanning job cannot
# label its own pull request — and most contributions to this repo come from
# forks, which would make labeling from the check job silently do nothing for
# the majority of pull requests. A workflow_run job runs in the base
# repository's context with write access, and uses the workflow definition from
# the default branch rather than from the pull request.
#
# The pull request number is read from an artifact rather than from the
# workflow_run payload, because `workflow_run.pull_requests` is empty for fork
# pull requests.
#
# A label written by GITHUB_TOKEN raises no `labeled` event, so this workflow
# cannot re-trigger the check it reports on — the two cannot loop.
#
# NOTE: this workflow cannot be smoke-tested on the pull request that introduces
# it. A workflow_run trigger only fires for a workflow file that is already on
# the default branch, so the first real run happens after merge. Verifying it is
# a post-merge step: push a commit adding an unallowlisted identifier to a
# scratch pull request, confirm the label arrives, redact the value, confirm the
# label goes away.

on:
  workflow_run:
    workflows: ["Scan for AWS identifiers"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: label-aws-identifiers-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    # The repository's default workflow permission is read-only, which is the
    # recommended baseline and must stay that way at the repository level.
    # Elevation therefore belongs here, on the one job that needs to write, and
    # is scoped to the two things it writes.
    permissions:
      contents: read
      actions: read # download the artifact from the triggering run
      pull-requests: write # add / remove the label
    # A cancelled or skipped scan run has nothing to report.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Download the check outcome
        id: artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aws-id-check-result
          path: result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read outcome
        id: outcome
        run: |
          if [ ! -f result/pr-number ] || [ ! -f result/outcome ]; then
            echo "::notice::No outcome artifact found; nothing to label."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr=$(tr -dc '0-9' < result/pr-number)
          outcome=$(tr -dc 'a-z' < result/outcome)

          case "$outcome" in
            pass|fail) ;;
            error)
              # The check ran but could not reach a verdict: a malformed
              # allowlist, a failed self-check, an unreachable remote. The
              # scanning job has already failed, so the pull request is not
              # going anywhere, and leaving the label untouched is the point —
              # `needs-id-redact` says "this pull request contains identifiers",
              # which is a claim nobody is in a position to make here. Applying
              # it would send the author hunting for a value that does not
              # exist; removing it would clear a true finding from an earlier
              # run on the strength of an infrastructure failure.
              echo "::notice::The scan could not complete, so the needs-id-redact label is left as it is."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::warning::Unexpected artifact contents (pr='$pr' outcome='$outcome')."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ -z "$pr" ]; then
            echo "::warning::Artifact carries outcome '$outcome' but no pull request number."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Apply or remove the label
        if: steps.outcome.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Required. `gh` resolves the target repository from git remotes, and
          # this job deliberately does no checkout, so without GH_REPO every
          # `gh` call here fails with "fatal: not a git repository" before
          # reaching the API.
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.outcome.outputs.pr }}
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
          LABEL: needs-id-redact
        run: |
          if [ "$OUTCOME" = "fail" ]; then
            # Idempotent: creating an existing label, or adding one a pull
            # request already has, is a no-op and emits no `labeled` event, so
            # this cannot loop. D93F0B matches the `needs-evals` label, the
            # other check-output label in this repository.
            gh label create "$LABEL" \
              --description "Unredacted AWS account IDs or EC2 instance IDs found in this pull request" \
              --color D93F0B 2>/dev/null || true
            gh pr edit "$PR" --add-label "$LABEL"
            echo "::notice::Labeled PR #$PR with $LABEL."
          else
            # Checked rather than attempted-and-ignored. `--remove-label` errors
            # when the label is absent, so suppressing that one error with
            # `|| true` would also suppress every other error, including a
            # missing-GH_REPO failure — the step would report success while
            # doing nothing. That exact bug was fixed in
            # label-skill-evals-result.yml; this file starts from the fix.
            #
            # The lookup is a separate statement on purpose. Piping it straight
            # into a test — `gh pr view ... | grep -qx true` — reproduces the
            # same pathology: a failed lookup prints nothing, the test simply
            # does not match, and the step reports "the label wasn't set" and
            # exits 0. `set -e` does not catch it, because a command failing
            # inside an `if` condition is exempt from errexit. As its own
            # assignment, a failed lookup fails the job, while an absent label
            # stays benign.
            #
            # LABEL is read from the environment by jq rather than interpolated
            # into the jq program text; `gh --jq` has no `--arg`.
            has_label=$(gh pr view "$PR" --json labels \
                          --jq '[.labels[].name] | index(env.LABEL) != null')
            if [ "$has_label" = "true" ]; then
              gh pr edit "$PR" --remove-label "$LABEL"
              echo "::notice::PR #$PR passed; removed $LABEL."
            else
              echo "::notice::PR #$PR passed; $LABEL was not set."
            fi
          fi
