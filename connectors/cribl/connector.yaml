schema_version: 1
name: cribl
version: 1.0.0
title: Cribl
vendor: Cribl, Inc.
description: Query Cribl Sources, Destinations, Pipelines, Worker Groups, metrics, alerts and Search data during investigations.
categories: [telemetry]
tier: partner-managed
type: mcp
mcp:
  endpoint: 
    - { label: Cribl.Cloud MCP Endpoint, endpoint: "https://{{config.cribl-cloud-tenant}}.cribl.cloud/api/v1/mcp" }
    - { label: Cribl On-prem Leader MCP Endpoint, endpoint: "https://{{config.cribl-onprem-leader-hostname-port}}.cribl.cloud/api/v1/mcp" }
  auth:
    # The customer pastes a Cribl.Cloud Bearer session token (Settings > Global >
    # MCP Server > Get your token). The token carries the copying user's identity
    # and RBAC, and Cribl re-checks permissions on every tool call.
    - type: api_key
      headers:
        - { header: Authorization, label: Cribl Bearer token, prefix: "Bearer {{config.cribl-bearer}}" }
  config:
    # The full "<workspace>-<organization>" label from the customer's Cribl.Cloud tenant.
    - { name: cribl-cloud-tenant, label: Your Cribl.Cloud Workspace and Organization (workspace-organization), pattern: "^[a-z0-9-]{1,63}$" }
    # The full "<hostname>-<port>" label from the customer's Cribl.Cloud On-Prem Leader Hostname and Port.
    - { name: cribl-on-prem-leader-hostname-port, label: Your Cribl On-prem hostname and port (hostname:port), pattern: "^[a-z0-9-]{1,63}$" }
    # Your Cribl Bearer token for the MCP authentication
    - { name: cribl-bearer, label: Your Cribl Bearer Token, pattern: "^[a-z0-9-]{1,63}$" }
skills: [cribl-investigation]
docs_url: https://docs.cribl.io/copilot/cribl-mcp-server/
support_url: https://cribl.io/support/
maintainers: [criblio]
