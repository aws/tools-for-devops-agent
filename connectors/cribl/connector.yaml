schema_version: 1
name: cribl
version: 1.0.1
title: Cribl
vendor: Cribl
description: Query Cribl Sources, Destinations, Pipelines, Worker Groups, metrics, alerts and Search data during investigations.
categories: [telemetry]
tier: partner-managed
type: mcp
mcp:
  endpoints:
    - { label: Cribl.Cloud, endpoint: "https://{{config.tenant}}.cribl.cloud/api/v1/mcp" }
    - { label: On-prem Leader, endpoint: "https://{{config.leader}}:{{config.port}}/api/v1/mcp" }
  auth:
    # The customer pastes a Cribl.Cloud Bearer session token (Settings > Global >
    # MCP Server > Get your token). The token carries the copying user's identity
    # and RBAC, and Cribl re-checks permissions on every tool call.
    - type: api_key
      headers:
        - { header: Authorization, label: Cribl Bearer token, prefix: "Bearer " }
  config:
    # The full "<workspace>-<organization>" label from the customer's Cribl.Cloud URL.
    - { name: tenant, label: Cribl.Cloud workspace and organization (workspace-org), pattern: "^[a-z0-9-]{1,63}$" }
    # The on-prem Leader's hostname, such as leader.example.com.
    - { name: leader, label: On-prem Leader hostname, pattern: "^[a-z0-9.-]{1,253}$" }
    # The Leader's API port, such as 9000.
    - { name: port, label: On-prem Leader API port, pattern: "^[0-9]{1,5}$" }
skills: [cribl-investigation]
docs_url: https://docs.cribl.io/copilot/cribl-mcp-server/
support_url: https://cribl.io/support/
contact_email: mcp-issues@cribl.io
maintainers: [jphipps-cribl, rarcbl]
