schema_version: 1
name: pagerduty
version: 1.0.0
title: PagerDuty
vendor: PagerDuty
description: List and triage PagerDuty incidents, check who is on call, look up services, teams and escalation policies, review change events, and acknowledge, resolve or add notes to incidents.
categories: [devops]
tier: partner-managed
type: mcp
mcp:
  endpoints:
    - { label: US, endpoint: "https://mcp.pagerduty.com/mcp" }
    - { label: EU, endpoint: "https://mcp.eu.pagerduty.com/mcp" }
  auth:
    - type: oauth_3lo
      authorization_url: https://identity.pagerduty.com/oauth/authorize
      exchange_url: https://identity.pagerduty.com/oauth/token
      scopes: [read, write]
      pkce: true
docs_url: https://docs.pagerduty.com/ai-automation/advance/pagerduty-mcp-server
support_url: https://support.pagerduty.com
contact_email: support@pagerduty.com
maintainers: [PagerDuty/event-orchestration]
