schema_version: 1
name: pagerduty
version: 1.0.0
title: PagerDuty
vendor: PagerDuty
description: AI-first incident detection, triage and response
categories: [devops]
tier: partner-managed
type: mcp
mcp:
  endpoints:
    - { label: US, endpoint: "https://mcp.pagerduty.com/mcp" }
    - { label: EU, endpoint: "https://mcp.eu.pagerduty.com/mcp" }
  auth:
    - type: api_key
      headers:
        - { header: Authorization, label: "PagerDuty API key", prefix: "Token token=" }
docs_url: https://docs.pagerduty.com/developer/mcp-tooling-remote-server
support_url: https://support.pagerduty.com
contact_email: support@pagerduty.com
maintainers: [PagerDuty/event-orchestration]
