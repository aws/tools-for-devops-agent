schema_version: 1
name: cloudaware
version: 1.0.1
title: Cloudaware
vendor: Cloudaware
description: Query your Cloudaware CMDB during investigations. Discover resource types, fields and relationships across your clouds and connected tools, then run SQL over the inventory.
categories: [devops]
tier: partner-managed
type: mcp
mcp:
  endpoint: https://inbound.prod.cloudaware.com/mcp
  auth:
    - type: api_key
      headers:
        - { header: Authorization, label: Cloudaware API key, prefix: "Bearer " }
        - { header: X-CA-ExportProject, label: Export Project }
        - { header: X-CA-SObjectsDataset, label: SObjects Dataset }
docs_url: https://docs.cloudaware.com/mcp-server-ai/
support_url: https://cloudaware.com/contact-us/
contact_email: support@cloudaware.com
maintainers: [gigware/developers, anatoliy11, yurykh1]
