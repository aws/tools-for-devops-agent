schema_version: 1
name: spellwarden
version: 1.0.0
title: Spellwarden
vendor: NETBEARS TEAM SRL
description: Check the skills and MCP servers your agents load, with findings, trust scores and alerts.
categories: [devops]
tier: partner-managed
type: mcp
mcp:
  endpoint: "https://dash.spellwarden.ai/api/v1/mcp"
  auth:
    - type: dynamic_client_registration
      authorization_server: https://dash.spellwarden.ai
    - type: api_key
      headers:
        - { header: Authorization, label: "Spellwarden API key (read access)", prefix: "Bearer " }
docs_url: https://spellwarden.ai/docs/aws-devops-agent
support_url: https://spellwarden.ai/docs/aws-devops-agent#support
contact_email: security@spellwarden.ai
maintainers: [mariusmitrofan]
