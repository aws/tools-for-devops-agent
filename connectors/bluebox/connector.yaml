schema_version: 1
name: bluebox
version: 1.0.0
title: Bluebox
vendor: Dynatrace
description: Ask Bluebox about live service health, errors, latency and dependencies during investigations, changes and releases, with evidence from your telemetry.
categories: [telemetry]
tier: partner-managed
type: mcp
mcp:
  endpoint: https://app.bluebox.ai/v1/mcp
  auth:
    # Default: a Bluebox access token (Account → Access tokens), sent as a bearer token, and the ID of the Bluebox
    # workspace the connection reads (starts with ws_), sent as X-Workspace-Id. Both are required
    - type: api_key
      headers:
        - { header: Authorization, label: Bluebox access token, prefix: "Bearer " }
        - { header: X-Workspace-Id, label: Bluebox workspace ID }
    # Sign in with Bluebox: AWS DevOps Agent registers its own public client and the customer approves access.
    # No workspace header: Bluebox reads the signed-in user's default, most recent or only workspace
    - type: dynamic_client_registration
      authorization_server: https://app.bluebox.ai
skills: [bluebox-observability]
docs_url: https://docs.bluebox.ai/mcp-server
support_url: https://docs.bluebox.ai/getting-help
contact_email: michael.stephan@dynatrace.com
maintainers: [MichaelStephan, SimonePomata]
