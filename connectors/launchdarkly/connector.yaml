schema_version: 1
# Equals the directory name. Permanent
name: launchDarkly
# Strict MAJOR.MINOR.PATCH, at most 32 characters, each part at most 10 digits. Start at 1.0.0 (Section 8 explains when to bump)
version: 1.0.0
# Shown on the tile
title: LaunchDarkly
vendor: LaunchDarkly
description: "Investigate and mitigate incidents with LaunchDarkly: see recent flag, rollout and AgentControl changes, then switch off a risky feature or change an AI agent to prompt, model configurations."
# One or more of: cloud, telemetry, pipeline, communication, in any order. More categories will be added
categories: [devops]
# partner-managed: you run and support the server. Shown as a badge
tier: partner-managed
type: mcp
mcp:
  # Either one endpoint, or a list of regional endpoints (not both)
  endpoint: https://mcp.launchdarkly.com/mcp/launchdarkly
  auth:
    # The hosted MCP server accepts only OAuth. The customer signs in to LaunchDarkly and DevOps Agent
    # registers its own client. This is the issuer named in the server's /.well-known/oauth-protected-resource
    - type: dynamic_client_registration
      authorization_server: https://mcp.launchdarkly.com/mcp/launchdarkly
