schema_version: 1

# Equals the directory name. Permanent.
name: celonis
version: 1.0.0
title: Celonis
vendor: Celonis SE
description: Query process data, get insights, and run orchestrations.
categories: [devops]
tier: partner-managed
type: mcp

mcp:
  # Select the Celonis realm, then enter the tenant (team) name.
  endpoints:
    - { label: ae-1, endpoint: "https://{{config.tenant}}.ae-1.celonis.cloud/mcp" }
    - { label: au-1, endpoint: "https://{{config.tenant}}.au-1.celonis.cloud/mcp" }
    - { label: br-1, endpoint: "https://{{config.tenant}}.br-1.celonis.cloud/mcp" }
    - { label: ca-1, endpoint: "https://{{config.tenant}}.ca-1.celonis.cloud/mcp" }
    - { label: ch-1, endpoint: "https://{{config.tenant}}.ch-1.celonis.cloud/mcp" }
    - { label: eu-1, endpoint: "https://{{config.tenant}}.eu-1.celonis.cloud/mcp" }
    - { label: eu-2, endpoint: "https://{{config.tenant}}.eu-2.celonis.cloud/mcp" }
    - { label: eu-3, endpoint: "https://{{config.tenant}}.eu-3.celonis.cloud/mcp" }
    - { label: eu-5, endpoint: "https://{{config.tenant}}.eu-5.celonis.cloud/mcp" }
    - { label: jp-1, endpoint: "https://{{config.tenant}}.jp-1.celonis.cloud/mcp" }
    - { label: sa-1, endpoint: "https://{{config.tenant}}.sa-1.celonis.cloud/mcp" }
    - { label: uk-1, endpoint: "https://{{config.tenant}}.uk-1.celonis.cloud/mcp" }
    - { label: us-1, endpoint: "https://{{config.tenant}}.us-1.celonis.cloud/mcp" }
    - { label: us-2, endpoint: "https://{{config.tenant}}.us-2.celonis.cloud/mcp" }
    - { label: in-1, endpoint: "https://{{config.tenant}}.in-1.celonis.cloud/mcp" }
    - { label: us-3, endpoint: "https://{{config.tenant}}.us-3.celonis.cloud/mcp" }
    - { label: kr-2, endpoint: "https://{{config.tenant}}.kr-2.celonis.cloud/mcp" }
  auth:
    - type: oauth_3lo
      authorization_url:
        ae-1: "https://{{config.tenant}}.ae-1.celonis.cloud/oauth2/authorize"
        au-1: "https://{{config.tenant}}.au-1.celonis.cloud/oauth2/authorize"
        br-1: "https://{{config.tenant}}.br-1.celonis.cloud/oauth2/authorize"
        ca-1: "https://{{config.tenant}}.ca-1.celonis.cloud/oauth2/authorize"
        ch-1: "https://{{config.tenant}}.ch-1.celonis.cloud/oauth2/authorize"
        eu-1: "https://{{config.tenant}}.eu-1.celonis.cloud/oauth2/authorize"
        eu-2: "https://{{config.tenant}}.eu-2.celonis.cloud/oauth2/authorize"
        eu-3: "https://{{config.tenant}}.eu-3.celonis.cloud/oauth2/authorize"
        eu-5: "https://{{config.tenant}}.eu-5.celonis.cloud/oauth2/authorize"
        jp-1: "https://{{config.tenant}}.jp-1.celonis.cloud/oauth2/authorize"
        sa-1: "https://{{config.tenant}}.sa-1.celonis.cloud/oauth2/authorize"
        uk-1: "https://{{config.tenant}}.uk-1.celonis.cloud/oauth2/authorize"
        us-1: "https://{{config.tenant}}.us-1.celonis.cloud/oauth2/authorize"
        us-2: "https://{{config.tenant}}.us-2.celonis.cloud/oauth2/authorize"
        in-1: "https://{{config.tenant}}.in-1.celonis.cloud/oauth2/authorize"
        us-3: "https://{{config.tenant}}.us-3.celonis.cloud/oauth2/authorize"
        kr-2: "https://{{config.tenant}}.kr-2.celonis.cloud/oauth2/authorize"
      exchange_url:
        ae-1: "https://{{config.tenant}}.ae-1.celonis.cloud/oauth2/token"
        au-1: "https://{{config.tenant}}.au-1.celonis.cloud/oauth2/token"
        br-1: "https://{{config.tenant}}.br-1.celonis.cloud/oauth2/token"
        ca-1: "https://{{config.tenant}}.ca-1.celonis.cloud/oauth2/token"
        ch-1: "https://{{config.tenant}}.ch-1.celonis.cloud/oauth2/token"
        eu-1: "https://{{config.tenant}}.eu-1.celonis.cloud/oauth2/token"
        eu-2: "https://{{config.tenant}}.eu-2.celonis.cloud/oauth2/token"
        eu-3: "https://{{config.tenant}}.eu-3.celonis.cloud/oauth2/token"
        eu-5: "https://{{config.tenant}}.eu-5.celonis.cloud/oauth2/token"
        jp-1: "https://{{config.tenant}}.jp-1.celonis.cloud/oauth2/token"
        sa-1: "https://{{config.tenant}}.sa-1.celonis.cloud/oauth2/token"
        uk-1: "https://{{config.tenant}}.uk-1.celonis.cloud/oauth2/token"
        us-1: "https://{{config.tenant}}.us-1.celonis.cloud/oauth2/token"
