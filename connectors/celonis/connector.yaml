        us-3: "https://{{config.tenant}}.us-3.celonis.cloud/oauth2/token"
        kr-2: "https://{{config.tenant}}.kr-2.celonis.cloud/oauth2/token"
      pkce: true
  config:
    - name: tenant
      label: Celonis tenant (team)
      pattern: "^[a-z0-9-]{1,63}$"
