schema_version: 1
name: wiz
version: 1.0.1
title: Wiz
vendor: Wiz, Inc.
description: Add Wiz security context to investigations, from vulnerabilities and misconfigurations to threats, detections and toxic combinations.
categories: [cloud]
tier: partner-managed
type: mcp
mcp:
  # The Wiz devops toolset: read-only tools for investigations
  endpoint: "https://mcp.app.wiz.io/?toolset=devops"
  auth:
    # The default: a Wiz MCP Integration (service account) created for the agent
    - type: api_key
      headers:
        - { header: Wiz-Client-Id, label: Client ID }
        - { header: Wiz-Client-Secret, label: Client Secret }
        - { header: Wiz-DataCenter, label: "Tenant Data Center (for example, us17)" }
    # Or sign in as a Wiz user
    - type: dynamic_client_registration
      authorization_server: https://mcp.app.wiz.io
skills: [wiz-security-context]
docs_url: https://docs.wiz.io/docs/connect-remote-wiz-mcp-server
support_url: https://support.wiz.io/hc/en-us
contact_email: support@wiz.io
maintainers: [henperez]
