schema_version: 1

# Equals the directory name. Permanent.
name: elastic

# Strict MAJOR.MINOR.PATCH. First submission starts at 1.0.0.
version: 1.0.0
title: Elastic
vendor: Elastic
description: Query Elastic logs, metrics, and traces during investigations.
categories: [telemetry]
tier: partner-managed
type: mcp

mcp:
  # One entry per Elastic Cloud Serverless region on AWS. The customer picks the
  # region and enters their project alias, the first label of their Kibana URL.
  endpoints:
    - { label: AWS us-east-1 (N. Virginia), endpoint: "https://{{config.project}}.kb.us-east-1.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS us-east-2 (Ohio), endpoint: "https://{{config.project}}.kb.us-east-2.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS us-west-2 (Oregon), endpoint: "https://{{config.project}}.kb.us-west-2.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS ca-central-1 (Canada), endpoint: "https://{{config.project}}.kb.ca-central-1.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS eu-west-1 (Ireland), endpoint: "https://{{config.project}}.kb.eu-west-1.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS eu-west-2 (London), endpoint: "https://{{config.project}}.kb.eu-west-2.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS eu-central-1 (Frankfurt), endpoint: "https://{{config.project}}.kb.eu-central-1.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS ap-northeast-1 (Tokyo), endpoint: "https://{{config.project}}.kb.ap-northeast-1.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS ap-southeast-1 (Singapore), endpoint: "https://{{config.project}}.kb.ap-southeast-1.aws.elastic.cloud/api/agent_builder/mcp" }
    - { label: AWS ap-southeast-2 (Sydney), endpoint: "https://{{config.project}}.kb.ap-southeast-2.aws.elastic.cloud/api/agent_builder/mcp" }
  # The console asks for this value and fills it in wherever {{config.project}} appears
  config:
    - { name: project, label: Project alias, pattern: "^[a-z0-9-]{1,63}$" }

  auth:
    # API key only. Create a dedicated key in the target Serverless project.
    # Grant feature_agentBuilder.read and read/view_index_metadata for the
    # required indices. Add feature privileges only for enabled tools.
    - type: api_key
      headers:
        # Customers paste the encoded credential without a prefix.
        # The connection form adds "ApiKey " to the Authorization header.
        - header: Authorization
          label: Encoded Elastic API key
          prefix: "ApiKey "

skills:
  - elastic-csp-investigation
  - elastic-k8s-investigation
  - elastic-llm-obs
  - elastic-sre-triage
  - elastic-onboarding
  - elastic-service-reliability

triggers:
  # A separate AWS DevOps Agent webhook token authenticates notifications.
  # Configure the Elastic Webhook connector with:
  # Authorization: Bearer <aws-webhook-token>
  # Do not reuse the Elastic MCP API key for this webhook.
  auth: api_key

  # JSON value fragments in Elastic Webhook / Kibana Mustache syntax.
  # Use per-alert actions in Kibana Classic Alerting, not alert summaries.
  incident:
    # Stable for the lifetime of an active alert.
    incidentId: '"{{alert.uuid}}"'
    title: '"{{rule.name}}"'
    # Example priority. Set this per rule; severity fields vary by rule type.
    priority: '"HIGH"'
    timestamp: '"{{date}}"'
    # Add service, host, environment, and incident details using rule variables.
    description: '"Elastic alert {{alert.id}} from rule {{rule.name}} in space {{rule.spaceId}}. Rule URL: {{rule.url}}"'
    # Optional: set this to the actual affected service, not the rule name.
    # service: '"<affected-service-name>"'
    # Metadata is retained here for source identification. Put information
    # needed by the investigation in title/description as well.
    data: >-
      {
        "metadata": {
          "source": "elastic-serverless",
          "ruleId": "{{rule.id}}",
          "alertId": "{{alert.id}}",
          "alertUuid": "{{alert.uuid}}",
          "ruleUrl": "{{rule.url}}"
        }
      }

docs_url: https://www.elastic.co/docs/explore-analyze/ai-features/agent-builder/mcp-server
support_url: https://www.elastic.co/support

maintainers: ["Udayel"]
