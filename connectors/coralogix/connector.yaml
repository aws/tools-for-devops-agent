schema_version: 1
# Equals the directory name. Permanent.
name: coralogix
# Strict MAJOR.MINOR.PATCH. First submission starts at 1.0.0.
version: 1.0.0
title: Coralogix
vendor: Coralogix
description: Query Coralogix logs, metrics and traces during investigations.
category: telemetry
tier: partner-managed
type: mcp
mcp:
  # Named public Coralogix regions only. BYOC and staging sites are excluded.
  # EU1 uses the bare api.coralogix.com host because api.eu1.coralogix.com
  # can return 403. Each host answers an unauthenticated MCP initialize with
  # 401 or 403.
  endpoints:
    - { label: EU1, endpoint: "https://api.coralogix.com/mgmt/api/v1/mcp" }
    - { label: EU2, endpoint: "https://api.eu2.coralogix.com/mgmt/api/v1/mcp" }
    - { label: US1, endpoint: "https://api.coralogix.us/mgmt/api/v1/mcp" }
    - { label: US2, endpoint: "https://api.us2.coralogix.com/mgmt/api/v1/mcp" }
    - { label: US3, endpoint: "https://api.us3.coralogix.com/mgmt/api/v1/mcp" }
    - { label: AP1, endpoint: "https://api.ap1.coralogix.in/mgmt/api/v1/mcp" }
    - { label: AP2, endpoint: "https://api.ap2.coralogix.com/mgmt/api/v1/mcp" }
    - { label: AP3, endpoint: "https://api.ap3.coralogix.com/mgmt/api/v1/mcp" }
  auth:
    # Coralogix MCP supports only API-key auth for DevOps Agent; its OAuth
    # server uses dynamic client registration and single-use refresh tokens,
    # which the DevOps Agent OAuth/DCR flows cannot complete.
    # Use a dedicated personal API key scoped read-only (ReadData on log,
    # metric and span data) — not an ingestion key.
    type: api_key
    headers:
      - { header: Authorization, label: Personal API key, prefix: "Bearer " }
skills:
  - alerts
  - ai-center
  - case-analytics
  - case-management
  - cases
  - coralogix-docs
  - coralogix-investigation
  - coralogix-logs
  - coralogix-rum
  - coralogix-spans
  - dashboards
  - dataprime
  - data-usage
  - datasets
  - infrastructure
  - metrics-query
  - olly
  - service-catalog
  - single-case
  - views
triggers:
  # Coralogix cannot compute the per-request HMAC-SHA256 signature, so the
  # customer authenticates the webhook with a static bearer API key.
  auth: api_key
  # Values are written in Coralogix Notification Center preset (Jinja) syntax,
  # using the Alert entity type where alert.* / alertDef.* variables exist.
  incident:
    # Combine the alert definition id with the firing timestamp so each firing
    # opens its own investigation (a repeated id is deduplicated and dropped).
    incidentId: '"{{ alertDef.id }}-{{ alert.timestamp }}"'
    title: '{{ alertDef.name | json_encode }}'
    # Map Coralogix P1–P5 to the DevOps Agent priority set.
    priority: '"{% if alertDef.priority == ''P1'' %}CRITICAL{% elif alertDef.priority == ''P2'' %}HIGH{% elif alertDef.priority == ''P3'' %}MEDIUM{% elif alertDef.priority == ''P4'' %}LOW{% else %}MINIMAL{% endif %}"'
    timestamp: '"{{ alert.timestamp }}"'
    description: '{{ alertDef.description | default(value='''') | json_encode }}'
    service: '{{ alertDef.name | json_encode }}'
    # Carry a deep link back to the alert and context to make the investigation
    # actionable.
    data: '{ "metadata": { "source": "coralogix", "alertUrl": "{{ alert.alertDataUrl | default(value='''') }}", "alertType": "{{ alertDef.type }}", "priority": "{{ alertDef.priority }}", "status": "{{ alert.status }}" } }'
docs_url: https://coralogix.com/docs/user-guides/mcp-server/aws-devops-agent/
support_url: https://coralogix.com/docs/support/
maintainers: [coralogix]
