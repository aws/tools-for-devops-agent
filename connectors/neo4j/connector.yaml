schema_version: 1
name: neo4j
version: 1.0.0
title: Neo4j
vendor: Neo4j, Inc.
description: Read-only diagnostics for self-managed Neo4j through the official Neo4j MCP server.
categories: [devops]
tier: partner-managed
type: mcp
mcp:
  endpoint: "https://{{config.host}}:{{config.port}}/db/neo4j/mcp"
  auth:
    - type: api_key
      headers:
        - { header: Authorization, label: Neo4j user and password (base64 of user:password), prefix: "Basic " }
        - { header: X-Neo4j-MCP-URI, label: Neo4j Bolt URI }
  config:
    - { name: host, label: Neo4j MCP server host, pattern: "^[a-z0-9.-]{1,253}$" }
    - { name: port, label: Neo4j MCP server port, pattern: "^[0-9]{1,5}$" }
skills: [neo4j-support-specialist]
docs_url: https://neo4j.com/docs/mcp/current/
support_url: https://support.neo4j.com/
contact_email: rafal.janicki@neo4j.com
maintainers: [rafaljanicki]
