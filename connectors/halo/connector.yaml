schema_version: 1
name: halo
version: 1.0.0
title: Halo
vendor: Halo Service Solutions
description: Trigger investigations from Halo tickets, then allow the agent to search knowledge and assets, send updates back to the ticket and more.
categories: [communication]
tier: partner-managed
type: mcp
mcp:
  # Each Halo instance has its own domain, and each Agent Space in Halo has its own MCP Toolset ID
  endpoint: "https://{{config.host}}/api/VirtualAgent/{{config.toolset_id}}/mcp"
  auth:
    - type: oauth_client_credentials
      exchange_url: "https://{{config.host}}/auth/token"
      scopes: [all]
  config:
    - { name: host, label: Halo domain, pattern: "^[a-z0-9.-]{1,253}$" }
    - { name: toolset_id, label: MCP Toolset ID, pattern: "^[a-f0-9-]{36}$" }
triggers:
  # Halo signs timestamp:body with the Agent Space's webhook secret
  auth: hmac
  incident:
    incidentId: '"<<ticket^id>>"'
    title: '<<ticket^summary>>'
    priority: '"{{awsdevopsagent-priority}}"'
    action: '"created"'
    timestamp: '<<ticket^dateoccurred>>'
    description: '<<ticket^details>>'
docs_url: https://www.usehalo.com/guides/3042
support_url: https://www.usehalo.com/contact-us
maintainers: [louis-halo]
