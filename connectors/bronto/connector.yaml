schema_version: 1
name: bronto
version: 1.0.0
title: Bronto
vendor: Bronto
description: Search Bronto logs, metrics and monitors during investigations.
categories: [telemetry]
tier: partner-managed
type: mcp
mcp:
  endpoints:
    - { label: EU, endpoint: "https://mcp.eu.bronto.io/mcp" }
    - { label: US, endpoint: "https://mcp.us.bronto.io/mcp" }
  auth:
    - type: dynamic_client_registration
      authorization_server:
        EU: https://mcp.eu.bronto.io
        US: https://mcp.us.bronto.io
    - type: api_key
      # Bronto reads API keys from this header, sent without a prefix.
      headers:
        - { header: X-BRONTO-API-KEY, label: Bronto API key }
skills:
  - bronto-error-investigation
  - bronto-dataset-discovery
  - bronto-log-search
triggers:
  auth: hmac
  incident:
    incidentId: '"bronto-$alert_id"'
    title: '"$title"'
    priority: '"HIGH"'
    action: '"created"'
    timestamp: '"$timestamp"'
    # Only title, description and priority reach the agent, so the monitor
    # context goes here rather than in data.
    description: '"$summary\n\nMonitor: $monitor_link\nQuery: $query\nGroup: $group\nValue: $current_value (threshold $threshold)\nWindow: $time_window"'
    service: '"$monitor_name"'
    data: '{ "metadata": { "source": "bronto", "monitorId": "$monitor_id", "monitorUrl": "$monitor_link", "status": "alert", "region": "$region" } }'
docs_url: https://docs.bronto.io/ai-features/aws-devops-agent
support_url: https://bronto.io/support
contact_email: security@bronto.io
maintainers: [GaryNicholls]
