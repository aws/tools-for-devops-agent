schema_version: 1
name: sumo-logic
version: 1.0.0
title: Sumo Logic
vendor: Sumo Logic, Inc.
description: Search logs, alerts, dashboards and SIEM insights in Sumo Logic during investigations.
categories: [telemetry]
tier: partner-managed
type: mcp
mcp:
  # One entry per Sumo Logic deployment, labelled as customers know them
  endpoints:
    - { label: US1, endpoint: "https://mcp.sumologic.com/mcp" }
    - { label: US2, endpoint: "https://mcp.us2.sumologic.com/mcp" }
    - { label: EU, endpoint: "https://mcp.eu.sumologic.com/mcp" }
    - { label: DE, endpoint: "https://mcp.de.sumologic.com/mcp" }
    - { label: JP, endpoint: "https://mcp.jp.sumologic.com/mcp" }
    - { label: AU, endpoint: "https://mcp.au.sumologic.com/mcp" }
    - { label: KR, endpoint: "https://mcp.kr.sumologic.com/mcp" }
    - { label: CA, endpoint: "https://mcp.ca.sumologic.com/mcp" }
    - { label: FED, endpoint: "https://mcp.fed.sumologic.com/mcp" }
  auth:
    # Customer signs in; they first enter a client ID/secret from an Authorization Code client created in Sumo Logic (see README)
    - type: oauth_3lo
      authorization_url:
        US1: https://service.sumologic.com/oauth2/authorize
        US2: https://service.us2.sumologic.com/oauth2/authorize
        EU: https://service.eu.sumologic.com/oauth2/authorize
        DE: https://service.de.sumologic.com/oauth2/authorize
        JP: https://service.jp.sumologic.com/oauth2/authorize
        AU: https://service.au.sumologic.com/oauth2/authorize
        KR: https://service.kr.sumologic.com/oauth2/authorize
        CA: https://service.ca.sumologic.com/oauth2/authorize
        FED: https://service.fed.sumologic.com/oauth2/authorize
      exchange_url:
        US1: https://service.sumologic.com/oauth2/token
        US2: https://service.us2.sumologic.com/oauth2/token
        EU: https://service.eu.sumologic.com/oauth2/token
        DE: https://service.de.sumologic.com/oauth2/token
        JP: https://service.jp.sumologic.com/oauth2/token
        AU: https://service.au.sumologic.com/oauth2/token
        KR: https://service.kr.sumologic.com/oauth2/token
        CA: https://service.ca.sumologic.com/oauth2/token
        FED: https://service.fed.sumologic.com/oauth2/token
      pkce: true
skills: [sumo-logic-investigator]
docs_url: https://www.sumologic.com/help/docs/api/mcp-server/
support_url: https://support.sumologic.com/
maintainers: [vsinghal13]
