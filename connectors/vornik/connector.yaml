schema_version: 1
# Equals the directory name. Permanent.
name: vornik
version: 1.0.0
title: Vornik
vendor: EaseIT Labs
description: Recall your own incident memory, read approved runbooks and hand follow-up work to sandboxed agents in self-hosted Vornik.
categories: [devops]
tier: partner-managed
type: mcp
mcp:
  # Vornik is self-hosted: the customer's own daemon serves the companion MCP
  # endpoint behind TLS. It answers an unauthenticated MCP initialize with 401.
  endpoint: "https://{{config.host}}:{{config.port}}/api/v1/mcp/companion"
  auth:
    # A Vornik companion key (sk-vornik-...) minted for this Agent Space with
    # vornikctl companion grant. Its scopes decide which tools it is offered.
    - type: api_key
      headers:
        - { header: Authorization, label: Vornik companion key, prefix: "Bearer " }
  config:
    - { name: host, label: Vornik host name, pattern: "^[a-z0-9.-]{1,253}$" }
    - { name: port, label: Vornik HTTPS port, pattern: "^[0-9]{1,5}$" }
docs_url: https://docs.vornik.io/guides/aws-devops-agent/
support_url: https://github.com/EaseIT-cz/vornik/issues
contact_email: vornik@easeit.cz
maintainers: [grinco]
