schema_version: 1
name: honeycomb
version: 1.0.0
title: Honeycomb
vendor: Honeycomb.io
description: Query Honeycomb traces, events, metrics, SLOs and triggers during investigations.
categories: [telemetry]
tier: partner-managed
type: mcp
mcp:
  endpoints:
    - { label: US, endpoint: "https://mcp.honeycomb.io/mcp" }
    - { label: EU, endpoint: "https://mcp.eu1.honeycomb.io/mcp" }
  auth:
    - type: dynamic_client_registration
      authorization_server:
        US: https://ui.honeycomb.io
        EU: https://ui.eu1.honeycomb.io
    - type: api_key
      headers:
        - { header: Authorization, label: "Management key (KEY_ID:KEY_SECRET)", prefix: "Bearer " }
skills:
  - honeycomb-production-investigation
  - honeycomb-query-patterns
  - honeycomb-slos-and-triggers
  - honeycomb-metrics-queries
  - honeycomb-observability-fundamentals
  - honeycomb-verify-recent-trace
  - honeycomb-create-board
triggers:
  auth: api_key
  incident:
    incidentId: '"honeycomb-{{ .Alert.InstanceID }}"'
    title: '{{ printf "[%s] %s" .Environment .Name | toJson }}'
    priority: '"HIGH"'
    timestamp: '{{ toJson .Alert.Timestamp }}'
    description: '{{ toJson .Alert.Description }}'
    service: '"honeycomb"'
    data: '{ "trigger_url": {{ toJson .URL }}, "result_url": {{ toJson .Result.URL }} }'
docs_url: https://docs.honeycomb.io/integrations/aws-devops-agent
support_url: https://support.honeycomb.io/
maintainers: [honeycombio/agentic-intelligence]
