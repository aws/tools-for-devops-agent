    - { label: Canada (ca-central-1a), endpoint: "https://api.ca-central-1a.arize.com/mcp" }
  auth:
    - type: api_key
      headers:
        - { header: Authorization, label: Arize API key, prefix: "Bearer " }
docs_url: https://arize.com/docs/api-clients/mcp/overview
support_url: https://arize.com/support
contact_email: security@arize.com
maintainers: [justonwestern]
