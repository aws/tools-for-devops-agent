schema_version: 1
name: checkly
version: 1.0.0
title: Checkly
vendor: Checkly
description: Query Checkly synthetic checks, uptime monitors, check results and root cause analyses during investigations.
categories: [telemetry]
tier: partner-managed
type: mcp
mcp:
  # One global endpoint; Checkly has no regional MCP servers
  endpoint: https://api.checklyhq.com/mcp
  auth:
    # A service API key the customer creates for the agent, scoped to one Checkly account
    - type: api_key
      headers:
        - { header: Authorization, label: Service API key, prefix: "Bearer " }
        - { header: X-Checkly-Account, label: Account ID }
triggers:
  # Checkly signs webhooks over the raw body only, so the customer uses the API key
  auth: api_key
  incident:
    # Check ID plus run start time: unique per firing, also for heartbeat monitors
    incidentId: '"checkly-{{CHECK_ID}}-{{STARTED_AT}}"'
    title: '"{{ALERT_TITLE}}"'
    priority: '"HIGH"'
    # Carries the context the agent needs, since data is not passed to the investigation.
    # RESULT_LINK uses three braces so the URL is not HTML-escaped
    description: '"Checkly alert {{ALERT_TYPE}} for {{CHECK_TYPE}} check {{CHECK_NAME}} ({{CHECK_ID}}). Run started {{STARTED_AT}} from {{RUN_LOCATION}} ({{REGION}}). Response time {{RESPONSE_TIME}} ms. Group: {{GROUP_NAME}}. Tags: {{TAGS}}. Result: {{{RESULT_LINK}}}"'
    service: '"{{CHECK_NAME}}"'
    data: '{ "checkId": "{{CHECK_ID}}", "checkResultId": "{{CHECK_RESULT_ID}}", "checkType": "{{CHECK_TYPE}}", "alertType": "{{ALERT_TYPE}}", "region": "{{REGION}}", "resultLink": "{{{RESULT_LINK}}}" }'
docs_url: https://www.checklyhq.com/docs/ai/mcp-server/
support_url: https://www.checklyhq.com/support/
contact_email: engineering@checklyhq.com
maintainers: [checkly/engineering]
